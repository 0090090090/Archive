/* ── 발췌를 이미지로 ── */
function wrapLines(x, text, maxW) {
  const out = [];
  let idx = 0;
  for (const para of String(text || '').split('\n')) {
    if (para === '') out.push({ t: '', o: idx });
    else {
      let start = idx, line = '';
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        if (line && x.measureText(line + ch).width > maxW) {
          out.push({ t: line, o: start });
          start += line.length;
          line = ch;
        } else line += ch;
      }
      out.push({ t: line, o: start });
    }
    idx += para.length + 1;
  }
  return out;
}

async function exportExcerpt(e) {
  toast('이미지를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const W = 1000, PAD = 88, FS = 27;
  const LH = Math.round(FS * readPrefs.lh);
  const INK = '#14161A', INK2 = '#26292F', FAINT = '#A6ABB2', HAIR = '#E5E7E8', LINE = '#D2D6D9', TEAL = '#0F4C47';

  const FACE = readPrefs.font === 'sans'
    ? '"Pretendard Variable", Pretendard, sans-serif' : '"Noto Serif KR", serif';
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `400 ${FS}px ${FACE}`;
  let lines = wrapLines(probe, e.body || '', W - PAD * 2);
  const maxLines = Math.floor((28000 - PAD - 351) / LH) + 1;
  const cut = lines.length > maxLines;
  if (cut) lines = lines.slice(0, maxLines);

  const showMemo = readPrefs.memo2 !== false && (e.memo2 || '').trim();
  let memoLines = [];
  const MFS = Math.round(FS * 0.78), MLH = Math.round(MFS * 1.85);
  if (showMemo) {
    probe.font = `400 ${MFS}px ${FACE}`;
    memoLines = wrapLines(probe, e.memo2, W - PAD * 2);
  }
  const memoH = showMemo ? LH + 90 - MLH + memoLines.length * MLH : 0;   // 본문 마지막 줄 아래 여백까지 포함
  const H = Math.max(520, PAD + 351 + (lines.length - 1) * LH + (cut ? 40 : 0) + memoH);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  x.fillStyle = '#FBFAF7'; x.fillRect(0, 0, W, H);
  x.strokeStyle = HAIR; x.lineWidth = 1.5;
  x.strokeRect(30.5, 30.5, W - 61, H - 61);
  x.strokeStyle = TEAL; x.lineWidth = 1.5;
  const T = 24, o = 30.5;
  [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]].forEach(([px, py, sx, sy]) => {
    x.beginPath(); x.moveTo(px + sx * T, py); x.lineTo(px, py); x.lineTo(px, py + sy * T); x.stroke();
  });

  let y = PAD + 46;
  x.textAlign = 'left';
  x.font = `${readPrefs.font === 'sans' ? '600' : '400'} 42px ${FACE}`;
  x.fillStyle = INK;
  x.fillText(fit(x, e.title || '제목 없음', W - PAD * 2), PAD, y);
  y += 46;
  const meta = [folderName(e.folderId), e.d1 || e.source, e.d2].filter(Boolean).join('   ·   ');
  x.font = '400 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT;
  x.fillText(fit(x, meta, W - PAD * 2), PAD, y);
  y += 34;
  x.strokeStyle = LINE; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, y + .5); x.lineTo(W - PAD, y + .5); x.stroke();
  y += 62;

  x.font = `400 ${FS}px ${FACE}`;
  const hs = e.highlights || [];
  for (const L of lines) {
    for (const h of hs) {
      const s = Math.max(h.s, L.o), en = Math.min(h.e, L.o + L.t.length);
      if (en <= s) continue;
      const x0 = x.measureText(L.t.slice(0, s - L.o)).width;
      const w = x.measureText(L.t.slice(s - L.o, en - L.o)).width;
      x.fillStyle = HL[h.c] || HL.y;
      x.fillRect(PAD + x0, y - FS * 0.88, w, FS * 1.2);
    }
    x.fillStyle = INK2;
    if (L.t) x.fillText(L.t, PAD, y);
    y += LH;
  }
  if (cut) {
    x.font = '400 19px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.fillText('… 본문이 길어 여기까지만 담았어요', PAD, y + 10);
    y += 34;
  }

  // 추가 메모
  if (showMemo) {
    y += 24;
    x.strokeStyle = 'rgba(15,76,71,.3)'; x.lineWidth = 1;
    x.setLineDash([3, 5]);
    x.beginPath(); x.moveTo(PAD, y + .5); x.lineTo(W - PAD, y + .5); x.stroke();
    x.setLineDash([]);
    y += 34;
    x.font = '500 17px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.fillText('M E M O', PAD, y);
    y += 32;
    x.font = `400 ${MFS}px ${FACE}`;
    x.fillStyle = TEAL;
    memoLines.forEach(L => { if (L.t) x.fillText(L.t, PAD, y); y += MLH; });
  }

  x.strokeStyle = HAIR; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, H - 96.5); x.lineTo(W - PAD, H - 96.5); x.stroke();
  x.font = '400 18px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT;
  x.fillText(fit(x, state.current.name, 420), PAD, H - 60);
  x.textAlign = 'right';
  x.fillText(fit(x, profile.nickname, 420), W - PAD, H - 60);

  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${(e.title || 'excerpt').replace(/[\\/:*?"<>|\s]/g, '')}_발췌.png`, e.title);
  }, 'image/png');
}

/* ════════ 스탯 세트 관리 ════════ */
function openStatSets(selectedId) {
  let cur = state.statSets.find(s => s.id === (selectedId || state.current?.statSetId)) || state.statSets[0];
  let draft = cur ? { ...cur, labels: [...cur.labels] } : { name: '', max: 10, labels: [''] };

  const m = openModal({
    title: '스탯 세트',
    wide: true,
    body: `<p class="hint" style="margin:0 0 14px">항목 이름과 최대값을 자유롭게 바꾸고, 세트로 저장해서 다른 캐릭터에도 그대로 쓸 수 있어요.</p>
      <div class="chipbar" id="set-chips"></div>
      <div id="set-form"></div>`,
    foot: `<button class="btn btn-ghost" id="close2">닫기</button>
           <button class="btn btn-key" id="save-set">세트 저장</button>`,
  });

  function drawChips() {
    m.querySelector('#set-chips').innerHTML =
      state.statSets.map(s => `<button class="chip" data-set="${s.id}" aria-pressed="${s.id === draft.id}">${esc(s.name)}</button>`).join('')
      + `<button class="chip" data-set="__new" aria-pressed="${!draft.id}" style="color:var(--brass)">＋ 새 세트</button>`;
    m.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
      if (b.dataset.set === '__new') draft = { name: '', max: 10, labels: ['', '', ''] };
      else { const s = state.statSets.find(x => x.id === b.dataset.set); draft = { ...s, labels: [...s.labels] }; }
      drawChips(); drawForm();
    });
  }

  function drawForm() {
    m.querySelector('#set-form').innerHTML = `
      <label class="field"><span>세트 이름</span>
        <input class="input" id="s-name" value="${esc(draft.name)}" placeholder="예: 전투형 8종" maxlength="30"></label>
      <label class="field"><span>최대값</span>
        <input class="input" id="s-max" type="number" min="1" max="100" value="${draft.max}" style="max-width:120px">
        <p class="hint">그래프와 슬라이더의 상한이에요. 보통 5, 10, 100을 써요.</p></label>
      <div class="field"><span>항목 (${draft.labels.length}개)</span>
        <div id="s-labels">${draft.labels.map((l, i) => `
          <div class="stat-edit-row">
            <input class="input" data-l="${i}" value="${esc(l)}" placeholder="항목 이름" maxlength="12">
            <span class="ord">
              <button data-lup="${i}" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
              <button data-ldn="${i}" title="아래로" ${i === draft.labels.length - 1 ? 'disabled' : ''}>▼</button>
            </span>
            <button class="icon-btn" data-lrm="${i}" title="지우기">✕</button>
          </div>`).join('')}</div>
        <button class="btn btn-sm btn-ghost" id="add-label">＋ 항목 추가</button>
        <p class="hint">3개 이상이면 방사형 그래프가 그려져요. 5~8개가 보기 좋아요.
          ▲▼로 순서를 바꾸면 그래프와 표에도 그 차례로 나와요.</p>
      </div>
      ${draft.id ? `<div style="display:flex;gap:8px;border-top:1px solid var(--hair);padding-top:14px">
        <button class="btn btn-sm btn-ghost" id="dup-set">복제해서 새 세트로</button>
        <button class="btn btn-sm btn-danger" id="del-set">이 세트 삭제</button></div>` : ''}`;

    m.querySelector('#s-name').oninput = e => draft.name = e.target.value;
    m.querySelector('#s-max').oninput = e => draft.max = Math.max(1, Math.min(100, Number(e.target.value) || 10));
    m.querySelectorAll('[data-l]').forEach(el => el.oninput = e => draft.labels[+el.dataset.l] = e.target.value);
    m.querySelectorAll('[data-lrm]').forEach(el => el.onclick = () => {
      draft.labels.splice(+el.dataset.lrm, 1);
      if (!draft.labels.length) draft.labels.push('');
      drawForm();
    });
    m.querySelectorAll('[data-lup]').forEach(el => el.onclick = () => { move(draft.labels, +el.dataset.lup, -1); drawForm(); });
    m.querySelectorAll('[data-ldn]').forEach(el => el.onclick = () => { move(draft.labels, +el.dataset.ldn, 1); drawForm(); });
    m.querySelector('#add-label').onclick = () => { draft.labels.push(''); drawForm(); };
    m.querySelector('#dup-set')?.addEventListener('click', () => {
      draft = { name: draft.name + ' 사본', max: draft.max, labels: [...draft.labels] };
      drawChips(); drawForm();
    });
    m.querySelector('#del-set')?.addEventListener('click', async () => {
      if (state.statSets.length <= 1) return toast('마지막 세트는 지울 수 없어요', 1);
      const used = state.chars.filter(c => c.statSetId === draft.id).length;
      if (!await confirmDialog('세트를 삭제할까요?',
        used ? `이 세트를 쓰는 캐릭터 ${used}명은 첫 번째 세트로 옮겨져요.` : '이 세트를 지워요.')) return;
      await F.deleteDoc(ref('statSets', draft.id));
      state.statSets = state.statSets.filter(s => s.id !== draft.id);
      const fallback = state.statSets[0].id;
      for (const c of state.chars.filter(c => c.statSetId === draft.id)) {
        c.statSetId = fallback;
        await F.updateDoc(ref('characters', c.id), { statSetId: fallback });
      }
      draft = { ...state.statSets[0], labels: [...state.statSets[0].labels] };
      drawChips(); drawForm();
      toast('세트를 삭제했어요');
      if (state.view === 'character') renderCharacter();
    });
  }

  drawChips(); drawForm();
  m.querySelector('#close2').onclick = closeModal;
  m.querySelector('#save-set').onclick = async () => {
    const labels = draft.labels.map(l => l.trim()).filter(Boolean);
    if (new Set(labels).size !== labels.length) return toast('항목 이름이 겹쳐요', 1);
    if (!labels.length) return toast('항목을 하나 이상 넣어 주세요', 1);
    try {
      const id = await saveStatSet({ ...draft, name: draft.name.trim() || '이름 없는 세트', labels });
      draft = { ...state.statSets.find(s => s.id === id), labels: [...labels] };
      drawChips(); drawForm();
      toast('세트를 저장했어요');
      if (state.view === 'character') renderCharacter();
    } catch (e) { toast('저장하지 못했어요: ' + (e.code || e.message), 1); }
  };
}

/* ════════ 카드 이미지로 저장 ════════ */
async function exportCard(c, set) {
  toast('카드를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const img = state.fullImg || c.thumb;
  let photo = null;
  if (img) photo = await new Promise(res => {
    const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = img;
  });

  const W = 1080, PAD = 84, R = 206;
  const INK = '#14161A', INK2 = '#3E434B', FAINT = '#A6ABB2', HAIR = '#E5E7E8', LINE = '#D2D6D9', TEAL = '#0F4C47';
  const labels = set?.labels || [], max = set?.max || 10, vals = c.stats || {};
  const fields = (c.fields || []).filter(f => !f.hide).slice(0, 9);   // '이미지 제외' 항목은 빼요
  const hasRadar = labels.length >= 3;
  const photoH = photo ? 700 : 0;

  /* 자리부터 계산해요 — 이름/부제 → 사진 → 프로필 → 굵은 선 → 그래프 */
  let ly = 100;
  const nameY = ly + 78;
  ly = nameY;
  const subY = c.subtitle ? ly + 44 : 0;
  if (c.subtitle) ly = subY;
  const photoTop = ly + 46;
  ly = photoTop + (photo ? photoH + 46 : 0);
  const fieldsTop = ly + (fields.length ? 10 : 0);
  let fy = fieldsTop;
  fields.forEach(() => fy += 56);
  let ruleY = 0, cy = 0, bottom = fy;
  if (hasRadar) { ruleY = fy + 12; cy = ruleY + 116 + R; bottom = cy + R + 80; }
  const H = Math.round(bottom + 128);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  // 바탕
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  const warm = x.createLinearGradient(0, 0, 0, H);
  warm.addColorStop(0, 'rgba(251,250,247,0)'); warm.addColorStop(1, 'rgba(247,246,242,.9)');
  x.fillStyle = warm; x.fillRect(0, 0, W, H);
  x.strokeStyle = HAIR; x.lineWidth = 1.5;
  x.strokeRect(30.5, 30.5, W - 61, H - 61);
  x.strokeStyle = TEAL; x.lineWidth = 1.5;
  const T = 26, o = 30.5;
  [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]].forEach(([px, py, sx, sy]) => {
    x.beginPath(); x.moveTo(px + sx * T, py); x.lineTo(px, py); x.lineTo(px, py + sy * T); x.stroke();
  });

  // 머리말
  x.font = '500 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT; x.textAlign = 'left';
  x.fillText('C H A R A C T E R   S H E E T', PAD, 100);
  x.textAlign = 'right'; x.fillStyle = INK2;
  x.fillText(fit(x, profile.nickname, 400), W - PAD, 100);

  // 이름 · 부제 (오른쪽 맞춤, 사진 위)
  x.fillStyle = INK;
  x.font = '300 66px "Noto Serif KR", serif';
  x.fillText(fit(x, c.name || '이름 없음', W - PAD * 2), W - PAD, nameY);
  if (c.subtitle) {
    x.font = '400 22px "IBM Plex Mono", monospace';
    x.fillStyle = TEAL;
    x.fillText(fit(x, c.subtitle, W - PAD * 2), W - PAD, subY);
  }
  x.textAlign = 'left';

  // 사진
  if (photo) {
    const pw = W - PAD * 2, pr = PAD + pw;
    x.save();
    x.beginPath(); x.rect(PAD, photoTop, pw, photoH); x.clip();
    coverDraw(x, photo, PAD, photoTop, pw, photoH);

    // 오른쪽에서 스며드는 어둠
    const shade = x.createLinearGradient(pr, 0, pr - 470, 0);
    shade.addColorStop(0, 'rgba(6,8,10,.82)');
    shade.addColorStop(.3, 'rgba(6,8,10,.46)');
    shade.addColorStop(.62, 'rgba(6,8,10,.18)');
    shade.addColorStop(.85, 'rgba(6,8,10,.05)');
    shade.addColorStop(1, 'rgba(6,8,10,0)');
    x.fillStyle = shade; x.fillRect(pr - 470, photoTop, 470, photoH);

    // 어둠 위에 얹는 세로선 — 위아래 끝까지 같은 굵기로
    x.fillStyle = 'rgba(46,124,112,.96)';
    x.fillRect(pr - 44, photoTop, 2.5, photoH);
    x.restore();

    x.strokeStyle = 'rgba(20,22,26,.14)'; x.lineWidth = 1;
    x.strokeRect(PAD + .5, photoTop + .5, pw - 1, photoH - 1);
  }

  // 프로필
  let y = fieldsTop;
  fields.forEach((f, i) => {
    x.font = '400 19px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.fillText(fit(x, f.k, 200), PAD, y + 20);
    x.font = '400 25px "Pretendard Variable", Pretendard, sans-serif';
    x.fillStyle = INK2;
    x.fillText(fit(x, f.v, W - PAD * 2 - 240), PAD + 240, y + 21);
    if (i < fields.length - 1) {
      x.strokeStyle = HAIR; x.lineWidth = 1;
      x.beginPath(); x.moveTo(PAD, y + 38.5); x.lineTo(W - PAD, y + 38.5); x.stroke();
    }
    y += 56;
  });

  // 프로필과 그래프를 가르는 굵은 선
  if (hasRadar) {
    x.strokeStyle = LINE; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(PAD, ruleY + .5); x.lineTo(W - PAD, ruleY + .5); x.stroke();

    const g = radarGeom(labels, vals, max, R);

    // 그래프 둘레의 은은한 확산 — 가장자리에서 완전히 사라져요
    const halo = x.createRadialGradient(W / 2, cy, R * .3, W / 2, cy, R * 2.05);
    halo.addColorStop(0, 'rgba(15,76,71,.06)');
    halo.addColorStop(.5, 'rgba(15,76,71,.028)');
    halo.addColorStop(1, 'rgba(15,76,71,0)');
    x.fillStyle = halo;
    x.fillRect(0, ruleY + 1, W, Math.min(cy + R * 2.05, H - 92.5) - ruleY - 1);

    // 양옆 여백 — 평균은 왼쪽 위, 총합은 오른쪽 아래
    const nums = labels.map(l => Number(vals[l] || 0));
    const sum = nums.reduce((n, v) => n + v, 0);
    const avg = Math.round((sum / nums.length) * 10) / 10;
    const sideMark = (cap, val, note, ax, capY, align) => {
      const bw = 118;
      const x1 = align === 'left' ? ax : ax - bw;
      x.textAlign = align;
      x.font = '500 15px "IBM Plex Mono", monospace';
      x.fillStyle = FAINT;
      x.fillText(cap.split('').join(' '), ax, capY);
      x.strokeStyle = LINE; x.lineWidth = 1;
      x.beginPath(); x.moveTo(x1, capY + 15.5); x.lineTo(x1 + bw, capY + 15.5); x.stroke();
      x.font = '300 46px "Noto Serif KR", serif';
      x.fillStyle = TEAL;
      x.fillText(String(val), ax, capY + 60);
      x.font = '400 14px "IBM Plex Mono", monospace';
      x.fillStyle = FAINT;
      x.fillText(note, ax, capY + 86);
      x.textAlign = 'left';
    };
    sideMark('AVERAGE', avg, `/ ${max}`, PAD, cy - R + 14, 'left');
    sideMark('TOTAL', sum, `/ ${max * nums.length}`, W - PAD, cy + R - 100, 'right');

    x.save(); x.translate(W / 2, cy);
    const path = k => { x.beginPath(); g.forEach((p, i) => {
      const px = Math.cos(p.a) * R * k, py = Math.sin(p.a) * R * k;
      i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); };
    x.setLineDash([2, 5]);
    [0.25, 0.5, 0.75].forEach(k => { path(k); x.strokeStyle = '#C3C8CB'; x.lineWidth = 1.2; x.stroke(); });
    x.setLineDash([]);
    path(1); x.strokeStyle = '#C3C8CB'; x.lineWidth = 1.2; x.stroke();
    g.forEach(p => { x.beginPath(); x.moveTo(0, 0); x.lineTo(p.ax, p.ay);
      x.strokeStyle = '#C3C8CB'; x.lineWidth = 1; x.stroke(); });
    x.beginPath();
    g.forEach((p, i) => i ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
    x.closePath();
    x.fillStyle = 'rgba(15,76,71,.10)'; x.fill();
    x.strokeStyle = TEAL; x.lineWidth = 2.4; x.lineJoin = 'round'; x.stroke();
    g.forEach(p => { x.beginPath(); x.arc(p.x, p.y, 5, 0, 7); x.fillStyle = TEAL; x.fill(); });
    g.forEach(p => {
      const lx = Math.cos(p.a) * (R + 44), ly2 = Math.sin(p.a) * (R + 44);
      x.textAlign = Math.abs(lx) < 14 ? 'center' : (lx > 0 ? 'left' : 'right');
      x.font = '400 22px "Pretendard Variable", Pretendard, sans-serif';
      x.fillStyle = INK2; x.fillText(p.label, lx, ly2);
      x.font = '500 20px "IBM Plex Mono", monospace';
      x.fillStyle = TEAL; x.fillText(String(p.value), lx, ly2 + 27);
    });
    x.restore();
    x.textAlign = 'left';
  }

  // 꼬리말
  x.strokeStyle = HAIR; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, H - 92.5); x.lineTo(W - PAD, H - 92.5); x.stroke();
  x.font = '400 18px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT;
  x.fillText(set ? `${set.name} · MAX ${max}` : '', PAD, H - 56);
  x.textAlign = 'right';
  x.fillText(fmtDate(Date.now()), W - PAD, H - 56);

  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${(c.name || 'character').replace(/[\\/:*?"<>|\s]/g, '')}_카드.png`, c.name);
  }, 'image/png');
}

function roundRect(x, l, t, w, h, r) {
  x.beginPath();
  x.moveTo(l + r, t);
  x.arcTo(l + w, t, l + w, t + h, r);
  x.arcTo(l + w, t + h, l, t + h, r);
  x.arcTo(l, t + h, l, t, r);
  x.arcTo(l, t, l + w, t, r);
  x.closePath();
}
function coverDraw(x, img, dx, dy, dw, dh) {
  const s = Math.max(dw / img.width, dh / img.height);
  const w = img.width * s, h = img.height * s;
  x.drawImage(img, dx + (dw - w) / 2, dy + (dh - h) / 2, w, h);
}
function fit(x, text, maxW) {
  let t = String(text || '');
  if (x.measureText(t).width <= maxW) return t;
  while (t.length > 1 && x.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}

/* ════════ 메모 카드 이미지 ════════ */
const MC_INK = '#14161A', MC_INK2 = '#3E434B', MC_MUTED = '#7B8189', MC_FAINT = '#A6ABB2',
      MC_HAIR = '#E5E7E8', MC_LINE = '#D2D6D9', MC_TEAL = '#0F4C47', MC_WARM = '#FBFAF7';
const SERIF = 'Noto Serif KR", serif', MONO = 'IBM Plex Mono", monospace',
      SANS = 'Pretendard Variable", Pretendard, sans-serif';
const fSerif = (w, px) => `${w} ${px}px "${SERIF}`;
const fMono = (w, px) => `${w} ${px}px "${MONO}`;
const fSans = (w, px) => `${w} ${px}px "${SANS}`;
const spread = t => String(t).split('').join(' ');

/* 단독 — 이름은 머리글, 아래에서 사진과 글이 세로선을 사이에 두고 키를 맞춰요 */
const MC_SOLO = {
  mode: 'solo',
  nameSize: 62, nameLH: 76, subSize: 21,
  photoW: 442, photoMin: 320, photoMax: 1180, gutter: 48,
  eyeSize: 13, kSize: 14, vSize: 22, vLH: 30, pairPad: 22, fieldMax: 8,
  memoLab: 13, chipSize: 15, chipH: 29, chipGap: 7, chipLH: 36, entryGap: 10, memoMax: 8,
  statGap: 46, statHead: 38, setSize: 26, pillSize: 15, pillPad: 22,
  rowH: 46, rowSize: 22, valSize: 24, statCols: 2,
};
/* 비교 — 사진 옆에 자리가 없으니 메모는 아래 띠에 한 줄기로 흘려요 */
const MC_CMP = {
  mode: 'cmp',
  nameSize: 42, nameLH: 52, subSize: 18,
  photoW: 304, photoMin: 280, photoMax: 620, gutter: 40,
  eyeSize: 12.5, kSize: 13.5, vSize: 20, vLH: 28, pairPad: 18, fieldMax: 5,
  memoLab: 13, chipSize: 14.5, chipH: 28, chipGap: 6, chipLH: 34, entryGap: 8, memoMax: 9,
  statGap: 26, statHead: 54, setSize: 23, pillSize: 14, pillPad: 20,
  rowH: 40, rowSize: 20, valSize: 21, statCols: 2,
  stripPadX: 30, stripPadY: 26, groupGap: 34,
};

const loadPhoto = src => src
  ? new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; })
  : Promise.resolve(null);

/* 한글은 띄어쓰기가 드물어 글자 단위로도 접어요 */
function mcWrapLines(x, text, font, maxW, maxLines = 99) {
  x.font = font;
  const src = String(text || '').replace(/\s+/g, ' ').trim();
  if (!src) return [];
  const lines = [];
  let cur = '';
  for (const ch of src) {
    if (cur && x.measureText(cur + ch).width > maxW) {
      const sp = cur.lastIndexOf(' ');
      if (sp > cur.length * 0.5) { lines.push(cur.slice(0, sp)); cur = cur.slice(sp + 1) + ch; }
      else { lines.push(cur); cur = ch; }
      if (lines.length >= maxLines) return lines;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

const mcMemos = (c, labels, max) => (c.memos || [])
  .filter(mo => mo.label && (mo.words || []).length)
  .filter(mo => !labels || !labels.length || labels.includes(mo.label))
  .slice(0, max);

/* 한 사람 분량의 판면 — draw:false 로 부르면 높이만 재요 */
function renderPlate(x, o) {
  const { c, photo, W, PAD, cfg, sets, showStats, draw, index } = o;
  const CW = W - PAD * 2;
  const solo = cfg.mode === 'solo';
  let pen = draw;                       // 두 번 재고 한 번만 그려요

  const txt = (t, px, py, font, color, align) => {
    x.font = font;
    if (pen) {
      x.fillStyle = color; x.textAlign = align || 'left';
      x.fillText(t, px, py); x.textAlign = 'left';
    }
    return x.measureText(t).width;
  };
  const rule = (x1, y1, x2, color, w) => {
    if (!pen) return;
    x.strokeStyle = color; x.lineWidth = w || 1;
    x.beginPath(); x.moveTo(x1, y1); x.lineTo(x2, y1); x.stroke();
  };
  const twinRule = (x1, y1, x2) => { rule(x1, y1 + 0.5, x2, MC_LINE, 1.5); rule(x1, y1 + 6.5, x2, MC_HAIR, 1); };
  const box = (l, t, w, h, color) => { if (pen) { x.fillStyle = color; x.fillRect(l, t, w, h); } };

  /* 키워드 칩 — 흰 바탕에 가느다란 테두리 */
  const chip = (t, l, top) => {
    const f = fSans(400, cfg.chipSize);
    x.font = f;
    const w = x.measureText(t).width + 26;
    if (pen) {
      roundRect(x, l, top, w, cfg.chipH, 3);
      x.fillStyle = '#FFFFFF'; x.fill();
      x.strokeStyle = MC_LINE; x.lineWidth = 1; x.stroke();
      x.fillStyle = MC_INK2; x.textAlign = 'left';
      x.fillText(t, l + 13, top + cfg.chipH / 2 + cfg.chipSize * 0.36);
    }
    return w;
  };

  /* 라벨 ─ 칩 을 한 줄기로 흘려요 */
  const flowMemos = (list, left, top, maxW, opt = {}) => {
    const labFont = fMono(500, cfg.memoLab);
    const chipFont = fSans(400, cfg.chipSize);
    let cx = left, cy = top, first = true;
    const limit = () => left + ((cy === top && opt.reserve) ? maxW - opt.reserve : maxW);
    list.forEach(mo => {
      if (!first) {
        if (opt.perEntry) { cx = left; cy += cfg.chipLH + cfg.entryGap; }
        else cx += cfg.groupGap;
      }
      const lab = mo.label + '  ─';
      x.font = labFont;
      const lw = x.measureText(lab).width;
      x.font = chipFont;
      const fw = x.measureText(mo.words[0] || '').width + 26;
      if (cx > left && cx + lw + 12 + fw > limit()) { cx = left; cy += cfg.chipLH; }
      txt(lab, cx, cy + cfg.chipH / 2 + cfg.memoLab * 0.36, labFont, MC_TEAL);
      cx += lw + 12;
      mo.words.forEach(wd => {
        x.font = chipFont;
        const w = x.measureText(wd).width + 26;
        if (cx > left && cx + w > limit()) { cx = left; cy += cfg.chipLH; }
        chip(wd, cx, cy);
        cx += w + cfg.chipGap;
      });
      first = false;
    });
    return cy + cfg.chipH;
  };

  /* 구역 머리글 — 작은 글자 아래 칸 너비만큼의 실선 */
  const colMark = (label, px, py, w) => {
    txt(spread(label), px, py + 12, fMono(500, cfg.eyeSize), MC_TEAL);
    rule(px, py + 26.5, px + w, MC_HAIR, 1);
    return py + 44;
  };
  const pill = (t, px, top, font, ink, border, fill) => {
    x.font = font;
    const w = x.measureText(t).width + 28, h = 30;
    if (pen) {
      roundRect(x, px, top, w, h, h / 2);
      if (fill) { x.fillStyle = fill; x.fill(); }
      x.strokeStyle = border; x.lineWidth = 1; x.stroke();
      x.fillStyle = ink; x.textAlign = 'left';
      x.fillText(t, px + 14, top + h / 2 + cfg.pillSize * 0.4);
    }
    return w;
  };

  /* ── 이름 ── */
  let bodyTop = o.top;
  if (solo) {
    const nameFont = fSerif(300, cfg.nameSize);
    const lines = mcWrapLines(x, c.name || '이름 없음', nameFont, CW - 40, 2);
    let base = o.top + Math.round(cfg.nameSize * 0.8);
    lines.forEach((ln, i) => txt(ln, PAD, base + i * cfg.nameLH, nameFont, MC_INK));
    base += (lines.length - 1) * cfg.nameLH;
    if (c.subtitle) {
      base += 40;
      x.font = fMono(400, cfg.subSize);
      txt(fit(x, c.subtitle, CW), PAD, base, fMono(400, cfg.subSize), MC_TEAL);
    }
    twinRule(PAD, base + 40, W - PAD);
    bodyTop = base + 40 + 56;
  }

  const photoTop = bodyTop;
  const pw = photo ? cfg.photoW : 0;
  const rx = PAD + (photo ? pw + cfg.gutter : 0);
  const rw = W - PAD - rx;

  /* ── 오른쪽 칸 — 두 번 부르되 처음엔 재기만 해요 ── */
  const memos = mcMemos(c, o.labels, cfg.memoMax);
  const fields = (c.fields || [])
    .filter(f => !f.hide && ((f.k || '').trim() || (f.v || '').trim()))
    .slice(0, cfg.fieldMax);

  const runRight = () => {
    let ry = bodyTop;
    if (!solo) {
      const badge = [
        ...((c.tags || []).filter(Boolean).slice(0, 1).map(t => '#' + t)),
        String((index || 0) + 1).padStart(2, '0'),
      ].join('   ');
      x.font = fMono(500, 15);
      const bw = x.measureText(badge).width;
      const nameFont = fSerif(300, cfg.nameSize);
      const lines = mcWrapLines(x, c.name || '이름 없음', nameFont, rw - bw - 28, 2);
      let base = bodyTop + Math.round(cfg.nameSize * 0.82);
      txt(badge, W - PAD, bodyTop + 20, fMono(500, 15), MC_FAINT, 'right');
      lines.forEach((ln, i) => txt(ln, rx, base + i * cfg.nameLH, nameFont, MC_INK));
      base += (lines.length - 1) * cfg.nameLH;
      if (c.subtitle) {
        base += 32;
        x.font = fMono(400, cfg.subSize);
        txt(fit(x, c.subtitle, rw), rx, base, fMono(400, cfg.subSize), MC_TEAL);
      }
      ry = base + 26;
      rule(rx, ry + 0.5, W - PAD, MC_HAIR, 1);
      ry += 34;
    }
    if (fields.length) {
      if (solo) ry = colMark('PROFILE', rx, ry, rw);
      fields.forEach(f => {
        x.font = fMono(400, cfg.kSize);
        txt(fit(x, f.k || '', rw), rx, ry + cfg.kSize * 0.9, fMono(400, cfg.kSize), MC_FAINT);
        const vFont = fSans(400, cfg.vSize);
        const vl = mcWrapLines(x, f.v || '', vFont, rw, 2);
        const vBase = ry + cfg.kSize * 0.9 + cfg.vSize + 7;
        vl.forEach((ln, i) => txt(ln, rx, vBase + i * cfg.vLH, vFont, MC_INK2));
        ry = vBase + Math.max(0, vl.length - 1) * cfg.vLH + cfg.pairPad;
      });
      ry -= 2;
    }
    if (solo && memos.length) {
      ry += 24;
      ry = colMark('MEMO', rx, ry, rw);
      ry = flowMemos(memos, rx, ry, rw, { perEntry: true }) + 4;
    }
    return ry;
  };

  pen = false;
  const rightH = runRight() - bodyTop;
  pen = draw;
  runRight();

  /* ── 사진은 오른쪽 칸과 키를 맞춰요 ── */
  const ph = photo ? Math.min(cfg.photoMax, Math.max(cfg.photoMin, Math.round(rightH))) : 0;
  const blockH = Math.max(ph, rightH);

  if (photo && pen) {
    x.save();
    x.beginPath(); x.rect(PAD, photoTop, pw, ph); x.clip();
    coverDraw(x, photo, PAD, photoTop, pw, ph);
    x.restore();
    x.strokeStyle = 'rgba(20,22,26,.2)'; x.lineWidth = 1;
    x.strokeRect(PAD + 0.5, photoTop + 0.5, pw - 1, ph - 1);
    box(Math.round(PAD + pw + cfg.gutter / 2), bodyTop, 1, blockH, MC_TEAL);
  }

  let y = bodyTop + blockH;

  /* 두 칸을 한 줄로 닫아요 — 길이가 달라도 바닥이 맞아 보이게 */
  if (solo || !memos.length) {
    y += 26;
    rule(PAD, y + 0.5, W - PAD, MC_HAIR, 1);
  }

  /* ── 비교판의 메모 띠 — 라벨과 칩이 한 줄기로 이어져요 ── */
  if (!solo && memos.length) {
    y += 28;
    const innerL = PAD + cfg.stripPadX, innerW = CW - cfg.stripPadX * 2 - 46;

    const wasPen = pen; pen = false;
    const bottom = flowMemos(memos, innerL, y + cfg.stripPadY + 3, innerW);
    pen = wasPen;
    const stripH = bottom - y + cfg.stripPadY + 3;

    box(PAD, y, CW, stripH, MC_WARM);
    box(PAD, y, CW, 3, MC_TEAL);
    box(PAD, y + stripH - 3, CW, 3, MC_TEAL);
    if (pen) {                                   // 오른쪽 여백에 세로로 세운 표기
      x.save();
      x.translate(W - PAD - 42, y + cfg.stripPadY + 2);
      x.rotate(Math.PI / 2);
      x.font = fMono(500, 13);
      x.fillStyle = MC_TEAL; x.textAlign = 'left';
      x.fillText(spread('MEMO'), 0, 0);
      x.restore();
    }
    flowMemos(memos, innerL, y + cfg.stripPadY + 3, innerW);
    y += stripH;
  }

  /* ── 스탯 ── */
  const useSets = showStats ? (sets || []).filter(st => (st.labels || []).filter(Boolean).length) : [];
  if (useSets.length) {
    y += cfg.statGap;
    twinRule(PAD, y, W - PAD);
    y += cfg.statHead;
    txt(spread('STAT'), PAD, y, fMono(500, cfg.eyeSize), MC_TEAL);
    y += 26;

    useSets.forEach((st, si) => {
      const labels = (st.labels || []).filter(Boolean);
      const vals = labels.map(l => Number((c.stats || {})[l] || 0));
      const mx = Math.max(...vals), mn = Math.min(...vals);
      const flat = mx === mn;

      const nameBase = y + cfg.setSize * 0.78;
      x.font = fSerif(500, cfg.setSize);
      const nm = fit(x, st.name, CW - 220);
      const nw = txt(nm, PAD, nameBase, fSerif(500, cfg.setSize), MC_INK);
      txt(`${si + 1}.`, PAD + nw + 14, nameBase, fMono(500, 15), MC_TEAL);
      txt(`MAX ${st.max || 10}`, W - PAD, nameBase - 1, fMono(400, cfg.pillSize), MC_FAINT, 'right');
      y = nameBase + cfg.pillPad;

      if (!flat) {
        const tied = t => {
          const ns = labels.filter((l, i) => vals[i] === t);
          return ns.length > 3 ? ns.slice(0, 3).join(' · ') + ' 외' : ns.join(' · ');
        };
        const hi = tied(mx), lo = tied(mn);
        const w1 = pill(`최고 — ${hi} ${mx}`, PAD, y, fSans(500, cfg.pillSize + 1),
                        MC_TEAL, MC_TEAL, 'rgba(15,76,71,.06)');
        pill(`최저 — ${lo} ${mn}`, PAD + w1 + 10, y, fSans(400, cfg.pillSize + 1),
             MC_MUTED, MC_LINE, null);
        y += 30 + cfg.pillPad;
      } else {
        y += 6;
      }

      const cols = labels.length > 5 ? cfg.statCols : 1;
      const colGap = 48;
      const cellW = (CW - colGap * (cols - 1)) / cols;
      const rows = Math.ceil(labels.length / cols);
      rule(PAD, y + 0.5, W - PAD, MC_LINE, 1);
      y += 5;
      labels.forEach((l, i) => {
        const ci = Math.floor(i / rows), ri = i % rows;
        const cx0 = PAD + ci * (cellW + colGap);
        const yy = y + ri * cfg.rowH, base = yy + Math.round(cfg.rowH * 0.64);
        const v = vals[i];
        const isMax = !flat && v === mx, isMin = !flat && v === mn;
        if (ri % 2 === 0) box(cx0, yy, cellW, cfg.rowH, MC_WARM);
        if (isMax || isMin) box(cx0, yy, 4, cfg.rowH, isMax ? MC_TEAL : MC_LINE);
        x.font = fSans(isMax ? 600 : 400, cfg.rowSize);
        txt(fit(x, l, cellW - 110), cx0 + 20, base, fSans(isMax ? 600 : 400, cfg.rowSize),
            isMax ? MC_INK : MC_INK2);
        txt(String(v), cx0 + cellW - 14, base, fMono(isMax ? 500 : 400, cfg.valSize),
            isMax ? MC_TEAL : (isMin ? MC_FAINT : MC_INK2), 'right');
        rule(cx0, yy + cfg.rowH - 0.5, cx0 + cellW, MC_HAIR, 1);
      });
      y += rows * cfg.rowH;
      if (si < useSets.length - 1) {
        y += 30;
        rule(PAD, y + 0.5, W - PAD, MC_HAIR, 1);
        y += 30;
      }
    });
  }

  return y;
}

/* 머리글 한 줄 */
function mcHead(x, W, PAD, y, left, right) {
  x.font = fMono(500, 19); x.fillStyle = MC_FAINT; x.textAlign = 'left';
  x.fillText(spread(left), PAD, y);
  x.textAlign = 'right'; x.fillStyle = MC_INK2;
  x.fillText(fit(x, right, 380), W - PAD, y);
  x.textAlign = 'left';
}

/* 한 사람 — 사진 · 프로필 · 메모 (+ 스탯) */
async function exportMemoCard(c, opts = {}, onBack) {
  toast('메모 카드를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const photo = await loadPhoto(state.fullImg || c.thumb);
  const sets = (opts.sets || []).map(id => state.statSets.find(s => s.id === id)).filter(Boolean).slice(0, 5);
  const W = 1080, PAD = 84, headY = 100, top = headY + 62;

  const probe = document.createElement('canvas').getContext('2d');
  const args = { c, photo, W, PAD, cfg: MC_SOLO, sets, showStats: !!opts.stats, labels: opts.labels };
  const H = Math.round(renderPlate(probe, { ...args, top, draw: false }) + 134);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  paperPlate(x, W, H);
  mcHead(x, W, PAD, headY, 'MEMO CARD', profile.nickname);
  renderPlate(x, { ...args, top, draw: true });
  plateFooter(x, W, H, PAD,
    opts.stats && sets.length ? sets.map(s => s.name).join('  ·  ') : '', fmtDate(Date.now()));

  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${(c.name || 'character').replace(/[\\/:*?"<>|\s]/g, '')}_메모카드.png`, c.name, onBack);
  }, 'image/png');
}

/* 같은 태그 안의 여러 사람을 한 장에 */
async function exportMemoCompare(chars, tag, opts = {}, onBack) {
  toast('비교 이미지를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const photos = await Promise.all(chars.map(c =>
    loadPhoto(c.id === state.current?.id ? (state.fullImg || c.thumb) : c.thumb)));
  const sets = (opts.sets || []).map(id => state.statSets.find(s => s.id === id)).filter(Boolean).slice(0, 5);
  const W = 1080, PAD = 84, headY = 100;
  const titleY = headY + 82, top0 = titleY + 76;
  const GAPB = 76;

  const probe = document.createElement('canvas').getContext('2d');
  const tops = [];
  let y = top0;
  chars.forEach((c, i) => {
    tops.push(y);
    y = renderPlate(probe, {
      c, photo: photos[i], W, PAD, cfg: MC_CMP, sets, labels: opts.labels,
      showStats: !!opts.stats, draw: false, top: y, index: i,
    });
    if (i < chars.length - 1) y += GAPB;
  });
  const H = Math.round(y + 134);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  paperPlate(x, W, H);
  mcHead(x, W, PAD, headY, 'TAG COMPARE', profile.nickname);

  x.fillStyle = MC_INK; x.font = fSerif(300, 52); x.textAlign = 'left';
  x.fillText(fit(x, '#' + tag, W - PAD * 2 - 200), PAD, titleY);
  x.textAlign = 'right'; x.font = fMono(400, 19); x.fillStyle = MC_FAINT;
  x.fillText(`${chars.length} 명 대조`, W - PAD, titleY);
  x.textAlign = 'left';
  x.strokeStyle = MC_LINE; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(PAD, titleY + 30.5); x.lineTo(W - PAD, titleY + 30.5); x.stroke();
  x.strokeStyle = MC_HAIR; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, titleY + 36.5); x.lineTo(W - PAD, titleY + 36.5); x.stroke();

  chars.forEach((c, i) => {
    if (i) {
      x.strokeStyle = MC_HAIR; x.lineWidth = 1;
      x.beginPath();
      x.moveTo(PAD, tops[i] - GAPB / 2 + 0.5); x.lineTo(W - PAD, tops[i] - GAPB / 2 + 0.5);
      x.stroke();
    }
    renderPlate(x, {
      c, photo: photos[i], W, PAD, cfg: MC_CMP, sets, labels: opts.labels,
      showStats: !!opts.stats, draw: true, top: tops[i], index: i,
    });
  });

  plateFooter(x, W, H, PAD,
    opts.stats && sets.length ? sets.map(s => s.name).join('  ·  ') : '', fmtDate(Date.now()));

  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${String(tag).replace(/[\\/:*?"<>|\s]/g, '')}_비교.png`, '#' + tag, onBack);
  }, 'image/png');
}

/* 메모 카드 만들기 창 */
let memoCardMemo = null;
function openMemoCardTool(c) {
  const saved = memoCardMemo && memoCardMemo.charId === c.id ? memoCardMemo : {};
  const myTags = (c.tags || []).filter(Boolean);
  let mode = myTags.length ? (saved.mode || 'solo') : 'solo';
  let stats = !!saved.stats;
  let sets = (saved.sets || (c.statSetId ? [c.statSetId] : [])).filter(id => state.statSets.some(s => s.id === id));
  if (!sets.length && state.statSets[0]) sets = [state.statSets[0].id];
  let tag = myTags.includes(saved.tag) ? saved.tag : myTags[0] || null;
  let picks = (saved.picks || []).filter(id => state.chars.some(x => x.id === id));
  let mLabels = saved.mLabels || null;          // null 이면 전부

  const inTag = () => state.chars.filter(x => (x.tags || []).includes(tag));
  const resetPicks = () => {
    picks = inTag().slice(0, 4).map(x => x.id);
    if (!picks.includes(c.id)) picks = [c.id, ...picks].slice(0, 4);
  };
  const labelPool = () => {
    const seen = [];
    state.chars.filter(x => picks.includes(x.id)).forEach(p =>
      (p.memos || []).forEach(mo => { if (mo.label && (mo.words || []).length && !seen.includes(mo.label)) seen.push(mo.label); }));
    const order = profile.memoLabels || [];
    return seen.sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'ko');
    });
  };
  if (mode === 'tag' && !picks.length) resetPicks();

  const remember = () => {
    memoCardMemo = { charId: c.id, mode, stats, sets: [...sets], tag, picks: [...picks], mLabels: mLabels ? [...mLabels] : null };
  };
  const back = () => { remember(); openMemoCardTool(c); };

  const m = openModal({
    title: '메모 카드',
    wide: true,
    body: `<div class="seg tabs" id="mc-tabs">
        <button data-mm="solo" aria-pressed="${mode === 'solo'}">단독</button>
        <button data-mm="tag" aria-pressed="${mode === 'tag'}" ${myTags.length ? '' : 'disabled'}>태그 비교</button>
      </div>
      <div id="mc-body"></div>`,
    foot: `<button class="btn btn-ghost" id="mc-close">닫기</button>
           <button class="btn btn-key" id="mc-make">이미지 만들기</button>`,
  });

  function statsBlock() {
    return `<div class="adv" style="margin:16px 0 0">
      <div class="adv-head"><span class="eyebrow">스탯 삽입</span><div class="spacer"></div>
        <label class="mc-switch"><input type="checkbox" id="mc-stats" ${stats ? 'checked' : ''}
          ${state.statSets.length ? '' : 'disabled'}> 넣기</label></div>
      ${state.statSets.length ? `<div class="chipbar" id="mc-sets" style="margin:0;${stats ? '' : 'opacity:.4;pointer-events:none'}">
          ${state.statSets.map(st => `<button class="chip" data-ms="${st.id}" aria-pressed="${sets.includes(st.id)}">${esc(st.name)} · ${st.labels.length}</button>`).join('')}
        </div>
        <p class="hint">세트는 5개까지. 그래프 대신 숫자 표로 들어가고, 최고·최저 항목만 표지로 짚어줘요.</p>`
        : `<p class="hint" style="margin:0">먼저 스탯 세트를 하나 만들어 주세요.</p>`}
    </div>`;
  }

  function draw() {
    const body = m.querySelector('#mc-body');
    if (mode === 'solo') {
      body.innerHTML = `<p class="hint" style="margin:0 0 6px">이름이 머리글로 올라가고, 그 아래 사진과 글이 세로선 하나를 사이에 두고 마주 봐요.
          메모는 프로필 바로 아래, 사진 옆에 이어집니다.</p>
        <div class="mc-sum">
          <span>사진 ${state.fullImg || c.thumb ? '있음' : '없음'}</span>
          <span>프로필 ${(c.fields || []).filter(f => !f.hide && (f.k || f.v)).length}</span>
          <span>메모 ${(c.memos || []).filter(mo => mo.label && (mo.words || []).length).length}줄</span>
        </div>
        ${statsBlock()}`;
    } else {
      const cands = inTag();
      const pool = labelPool();
      body.innerHTML = `<p class="hint" style="margin:0 0 10px">같은 태그를 가진 사람들을 한 장에 이어 붙여요.
          메모는 사진 옆이 아니라 아래쪽 띠에 세 칸으로 앉습니다.</p>
        <div class="chipbar" id="mc-tags">${myTags.map(t =>
          `<button class="chip" data-mt="${esc(t)}" aria-pressed="${t === tag}">#${esc(t)}</button>`).join('')}</div>
        <div class="adv" style="margin:0 0 14px">
          <div class="adv-head"><span class="eyebrow">넣을 사람 · 최대 4명</span><div class="spacer"></div>
            <span class="mono" style="font-size:11.5px;color:var(--faint)">${picks.length} / 4</span></div>
          <div class="chipbar" id="mc-picks" style="margin:0">${cands.length
            ? cands.map(p => `<button class="chip" data-mp="${p.id}" aria-pressed="${picks.includes(p.id)}">${esc(p.name || '이름 없음')}</button>`).join('')
            : `<span class="hint" style="margin:0">이 태그를 가진 캐릭터가 없어요.</span>`}</div>
        </div>
        <div class="adv" style="margin:0">
          <div class="adv-head"><span class="eyebrow">넣을 메모 라벨</span><div class="spacer"></div>
            ${pool.length && mLabels ? `<button class="linkish" id="mc-lall">모두 넣기</button>` : ''}</div>
          <div class="chipbar" id="mc-labels" style="margin:0">${pool.length
            ? pool.map(l => `<button class="chip" data-ml2="${esc(l)}" aria-pressed="${!mLabels || mLabels.includes(l)}">${esc(l)}</button>`).join('')
            : `<span class="hint" style="margin:0">고른 사람들에게 적어둔 메모가 없어요.</span>`}</div>
          ${pool.length ? `<p class="hint">고른 라벨만 띠에 들어가요. 한 사람당 ${MC_CMP.memoMax}개까지.</p>` : ''}
        </div>
        ${statsBlock()}`;
    }
    bind();
  }

  function bind() {
    const sw = m.querySelector('#mc-stats');
    if (sw) sw.onchange = () => { stats = sw.checked; draw(); };
    m.querySelectorAll('[data-ms]').forEach(b => b.onclick = () => {
      const id = b.dataset.ms;
      if (sets.includes(id)) sets = sets.filter(x => x !== id);
      else if (sets.length >= 5) return toast('세트는 5개까지 고를 수 있어요', 1);
      else sets = [...sets, id];
      draw();
    });
    m.querySelectorAll('[data-mt]').forEach(b => b.onclick = () => {
      tag = b.dataset.mt; resetPicks(); mLabels = null; draw();
    });
    m.querySelectorAll('[data-mp]').forEach(b => b.onclick = () => {
      const id = b.dataset.mp;
      if (picks.includes(id)) {
        if (picks.length === 1) return toast('한 명은 남겨두세요');
        picks = picks.filter(x => x !== id);
      } else {
        if (picks.length >= 4) return toast('한 번에 4명까지 담을 수 있어요', 1);
        picks = [...picks, id];
      }
      draw();
    });
    m.querySelectorAll('[data-ml2]').forEach(b => b.onclick = () => {
      const l = b.dataset.ml2, pool = labelPool();
      const cur = mLabels || [...pool];
      const next = cur.includes(l) ? cur.filter(v => v !== l) : [...cur, l];
      if (!next.length) return toast('라벨은 하나 이상 남겨두세요');
      mLabels = next.length === pool.length ? null : next;
      draw();
    });
    const la = m.querySelector('#mc-lall');
    if (la) la.onclick = () => { mLabels = null; draw(); };
  }

  m.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => {
    mode = b.dataset.mm;
    m.querySelectorAll('[data-mm]').forEach(b2 => b2.setAttribute('aria-pressed', b2.dataset.mm === mode));
    if (mode === 'tag' && !picks.length) resetPicks();
    draw();
  });
  draw();

  m.querySelector('#mc-close').onclick = closeModal;
  m.querySelector('#mc-make').onclick = () => {
    remember();
    const opts = { stats: stats && sets.length > 0, sets };
    if (mode === 'solo') return exportMemoCard(c, opts, back);
    const list = state.chars.filter(x => picks.includes(x.id));
    if (!list.length) return toast('넣을 사람을 골라 주세요', 1);
    exportMemoCompare(list, tag, { ...opts, labels: mLabels }, back);
  };
}

          다른 사람이 로그인해도 이 아카이브에 아무것도 저장할 수 없어요.</p>
        <div class="code-block" id="lock-rules2">${rulesFor(uid)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" id="copy-lock2">규칙 복사</button>
          <button class="btn btn-sm btn-ghost" id="copy-uid2">내 계정 ID 복사</button>
        </div>
        <p class="hint">HTML 파일 맨 위 <b>OWNER_UID</b>에 이 계정 ID를 넣어두면,
          다른 계정으로 들어온 사람에게는 비공개 안내가 보여요.<br>
          <span class="mono" style="font-size:11.5px">const OWNER_UID = "${esc(uid)}";</span></p>
      </details>
      ${localStorage.getItem(CFG_KEY) ? `<details class="setup-more">
        <summary>기기에서 연결 해제</summary>
        <p class="hint">이 브라우저에 저장해둔 Firebase 설정만 지우고 새로고침해요.
          기록은 그대로 남아요.</p>
        <button class="btn btn-sm btn-ghost" id="unlink">연결 해제</button>
      </details>` : ''}`,
    foot: `<button class="btn btn-ghost" id="logout">로그아웃</button>
           <button class="btn" id="close3">닫기</button>`,
  });
  m.querySelector('#close3').onclick = closeModal;
  m.querySelector('#logout').onclick = async () => {
    if (!await confirmDialog('로그아웃할까요?',
      '이 브라우저에서 계정을 끊어요. 기록은 그대로 남고, 다시 로그인하면 이어서 볼 수 있어요.', '로그아웃')) return;
    await A.signOut(auth); location.reload();
  };
  const un = m.querySelector('#unlink');
  if (un) un.onclick = () => { localStorage.removeItem(CFG_KEY); location.reload(); };
  m.querySelector('#bk-out').onclick = () => exportBackup(m.querySelector('#bk-img').checked);
  m.querySelector('#bk-in').onclick = () => m.querySelector('#bk-file').click();
  m.querySelector('#bk-file').onchange = e => {
    const f = e.target.files[0];
    if (f) importBackup(f);
  };
  m.querySelector('#copy-lock2').onclick = () => copyText(m.querySelector('#lock-rules2').textContent);
  m.querySelector('#copy-uid2').onclick = () => copyText(uid);
  m.querySelector('#open-trash').onclick = openTrash;
  m.querySelector('#save-nick').onclick = async () => {
    profile.nickname = m.querySelector('#nick').value.trim() || '내 아카이브';
    await F.setDoc(F.doc(db, 'users', uid), { nickname: profile.nickname }, { merge: true });
    $('#brand-sub').textContent = profile.nickname;
    if (state.view === 'gallery') renderGallery();
    closeModal(); toast('저장했어요');
  };
}

$('#account-btn').onclick = () => openAccount();
$('#statset-btn').onclick = () => openStatSets();
$('#brand-btn').onclick = () => { if (uid) renderGallery(); };

/* ════════ 백업 ════════ */
function progressModal(title) {
  const m = openModal({
    title,
    body: `<p class="hint" id="pg-text" style="margin:0">준비하는 중…</p>
      <div style="height:4px;background:var(--hair);border-radius:2px;margin-top:14px;overflow:hidden">
        <div id="pg-bar" style="height:100%;width:0;background:var(--teal);transition:width .2s"></div></div>`,
  });
  return {
    set(text, ratio) {
      const t = m.querySelector('#pg-text'), b = m.querySelector('#pg-bar');
      if (t) t.textContent = text;
      if (b) b.style.width = Math.round((ratio || 0) * 100) + '%';
    },
    done: closeModal,
  };
}

async function exportBackup(withImages) {
  const pg = progressModal('내보내는 중');
  try {
    const data = {
      app: 'chararchive', v: 1, exportedAt: Date.now(),
      nickname: profile.nickname, formPreset: profile.formPreset || null,
      tagLevels: profile.tagLevels || { char: {}, ex: {} },
      memoLabels: profile.memoLabels || [...MEMO_LABELS],
      statSets: state.statSets.map(x => ({ ...x })),
      notices: state.notices.map(x => ({ ...x })),
      characters: [], images: {},
    };
    const total = state.chars.length || 1;
    for (let i = 0; i < state.chars.length; i++) {
      const c = state.chars[i];
      pg.set(`캐릭터 ${i + 1} / ${state.chars.length} · ${c.name || ''}`, (i + 1) / total * (withImages ? .6 : .95));
      const snap = await F.getDocs(col('characters', c.id, 'excerpts'));
      data.characters.push({
        ...c,
        excerpts: snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(e => !e.deleted),
      });
    }
    if (withImages) {
      const withImg = state.chars.filter(c => c.imageId);
      for (let i = 0; i < withImg.length; i++) {
        pg.set(`이미지 ${i + 1} / ${withImg.length}`, .6 + (i + 1) / (withImg.length || 1) * .35);
        const d = await loadFullImage(withImg[i].imageId);
        if (d) data.images[withImg[i].imageId] = d;
      }
    }
    pg.set('파일로 묶는 중…', .98);
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `archive-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
    pg.done();
    bkSet({ last: Date.now(), snooze: 0 });
    if (state.view === 'gallery') renderGallery();
    toast(`내보냈어요 · 캐릭터 ${data.characters.length} · ${(blob.size / 1048576).toFixed(1)}MB`);
  } catch (e) {
    pg.done();
    toast('내보내지 못했어요: ' + (e.code || e.message), 1);
  }
}

async function importBackup(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
    if (data.app !== 'chararchive' || !Array.isArray(data.characters)) throw 0;
  } catch { return toast('이 아카이브의 백업 파일이 아니에요', 1); }

  const exCount = data.characters.reduce((n, c) => n + (c.excerpts?.length || 0), 0);
  const imgCount = Object.keys(data.images || {}).length;
  const ok = await confirmDialog('백업을 불러올까요?',
    `캐릭터 ${data.characters.length} · 발췌 ${exCount} · 스탯 세트 ${data.statSets?.length || 0} · 공지 ${data.notices?.length || 0}` +
    `${imgCount ? ` · 이미지 ${imgCount}` : ''} 을 넣어요. 같은 항목은 백업 내용으로 덮어써요.`, '불러오기');
  if (!ok) return;

  const pg = progressModal('불러오는 중');
  try {
    const totalSteps = data.characters.length + exCount + imgCount +
      (data.statSets?.length || 0) + (data.notices?.length || 0) + 1;
    let step = 0;
    const tick = t => { step++; pg.set(t, step / totalSteps); };

    for (const st of (data.statSets || [])) {
      const { id, ...rest } = st;
      await F.setDoc(ref('statSets', id || uidgen()), rest);
      tick('스탯 세트');
    }
    for (const n of (data.notices || [])) {
      const { id, ...rest } = n;
      await F.setDoc(ref('notices', id || uidgen()), rest);
      tick('공지');
    }
    for (const [imgId, dataUrl] of Object.entries(data.images || {})) {
      await F.setDoc(ref('images', imgId), { data: dataUrl, updatedAt: Date.now() });
      tick('이미지');
    }
    for (const c of data.characters) {
      const { id, excerpts = [], ...rest } = c;
      const cid = id || uidgen();
      await F.setDoc(ref('characters', cid), rest);
      tick(`캐릭터 · ${rest.name || ''}`);
      for (const e of excerpts) {
        const { id: eid, ...erest } = e;
        await F.setDoc(ref('characters', cid, 'excerpts', eid || uidgen()), erest);
        tick('발췌');
      }
    }
    const userPatch = {};
    if (data.formPreset) userPatch.formPreset = data.formPreset;
    if (data.tagLevels) userPatch.tagLevels = { char: {}, ex: {}, ...data.tagLevels };
    if (Array.isArray(data.memoLabels) && data.memoLabels.length) userPatch.memoLabels = data.memoLabels;
    if (Object.keys(userPatch).length) {
      await F.setDoc(F.doc(db, 'users', uid), userPatch, { merge: true });
      Object.assign(profile, userPatch);
    }
    tick('마무리');

    await Promise.all([loadChars(), loadStatSets(), loadNotices()]);
    pg.done();
    renderGallery();
    toast(`불러왔어요 · 캐릭터 ${data.characters.length}명`);
  } catch (e) {
    pg.done();
    toast('불러오지 못했어요: ' + (e.code || e.message), 1);
  }
}

/* ════════ 시작 ════════ */
(async function boot() {
  showLogin();
  const cfg = loadConfig();
  if (!cfg) return;
  try {
    await initFirebase(cfg);
    if (A.getRedirectResult) A.getRedirectResult(auth).catch(() => {});
  } catch (e) {
    toast('Firebase에 연결하지 못했어요. 설정을 확인해 주세요', 1);
  }
})();
</script>
