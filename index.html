          </div>`).join('') : `<p class="hint" style="margin:0 0 10px">아직 이어둔 캐릭터가 없어요.</p>`)
      : `<p class="hint" style="margin:0">관계를 맺을 다른 캐릭터가 아직 없어요.</p>`;
    m.querySelectorAll('[data-rid]').forEach(el => el.onchange = e => draft[+el.dataset.rid].id = e.target.value);
    m.querySelectorAll('[data-rlabel]').forEach(el => el.oninput = e => draft[+el.dataset.rlabel].label = e.target.value);
    m.querySelectorAll('[data-rrm]').forEach(el => el.onclick = () => { draft.splice(+el.dataset.rrm, 1); draw(); });
  }
  draw();
  m.querySelector('#rel-add').onclick = () => {
    if (!others.length) return toast('다른 캐릭터를 먼저 만들어 주세요');
    draft.push({ id: others[0].id, label: '' });
    draw();
  };
  m.querySelector('#rel-cancel').onclick = closeModal;
  m.querySelector('#rel-save').onclick = async () => {
    const seen = new Set();
    const list = draft.filter(r => r.id && !seen.has(r.id) && seen.add(r.id))
      .map(r => ({ id: r.id, label: (r.label || '').trim() }));
    const btn = m.querySelector('#rel-save');
    btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      await F.updateDoc(ref('characters', c.id), { relations: list, updatedAt: Date.now() });
      c.relations = list;
      closeModal(); renderCharacter(); toast('관계를 저장했어요');
    } catch (e) {
      btn.disabled = false; btn.textContent = '저장';
      toast('저장하지 못했어요: ' + (e.code || e.message), 1);
    }
  };
}

/* 스탯 분석 — 비교 · 세트 모음 · 순위 */
function statPool(setId) {
  const pool = state.chars.filter(x => (x.statSetId || state.statSets[0]?.id) === setId);
  if (state.current && !pool.some(x => x.id === state.current.id)) pool.push(state.current);
  return pool;
}

function rankInfo(setId) {
  const set = state.statSets.find(x => x.id === setId) || state.statSets[0];
  const labels = set?.labels || [], max = set?.max || 10;
  const pool = statPool(setId);
  const mine = state.current.stats || {};
  const rows = labels.map(l => {
    const vals = pool.map(pc => Number((pc.stats || {})[l] || 0));
    const v = Number(mine[l] || 0);
    const sorted = [...vals].sort((x, y) => y - x);
    return {
      label: l, v, vals, rank: sorted.indexOf(v) + 1, n: pool.length,
      avg: vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : 0,
      hi: Math.max(0, ...vals),
    };
  });
  const totals = pool.map(pc => labels.reduce((n, l) => n + Number((pc.stats || {})[l] || 0), 0));
  const myTotal = labels.reduce((n, l) => n + Number(mine[l] || 0), 0);
  return {
    set, labels, max, pool, rows, myTotal,
    totalRank: [...totals].sort((x, y) => y - x).indexOf(myTotal) + 1,
    avgTotal: totals.length ? totals.reduce((x, y) => x + y, 0) / totals.length : 0,
    outside: (state.current.statSetId || state.statSets[0]?.id) !== setId,
  };
}

let statToolsMemo = null;   // 이미지 창에서 돌아올 때 고른 상태를 되살려요

function openStatTools(tab) {
  const c = state.current;
  const curSet = state.statSets.find(x => x.id === c.statSetId) || state.statSets[0];
  const memo = statToolsMemo && statToolsMemo.charId === c.id ? statToolsMemo : {};
  tab = tab || memo.tab || 'compare';
  let picked = (memo.picked || []).filter(id => state.chars.some(x => x.id === id));
  if (!picked.length) picked = [c.id];
  let setsPicked = (memo.setsPicked || []).filter(id => state.statSets.some(x => x.id === id));
  if (!setsPicked.length) setsPicked = curSet ? [curSet.id] : [];
  let rankSet = state.statSets.some(x => x.id === memo.rankSet) ? memo.rankSet : curSet?.id;
  let cmpSet = state.statSets.some(x => x.id === memo.cmpSet) ? memo.cmpSet : curSet?.id;
  let fieldPick = (memo.fieldPick || []).filter(i => (c.fields || [])[i]);
  let showPeers = memo.showPeers !== false;
  let cmpPick = memo.cmpPick || [];         // 비교 이미지 아래에 넣을 프로필 항목(이름 기준)
  let cmpTags = memo.cmpTags || [];         // 비교 후보를 좁히는 태그(이 창 안에서만 써요)
  const remember = () => {
    statToolsMemo = { charId: c.id, tab, picked: [...picked], setsPicked: [...setsPicked],
                      rankSet, cmpSet, fieldPick: [...fieldPick], showPeers,
                      cmpPick: [...cmpPick], cmpTags: [...cmpTags] };
  };
  const back = () => openStatTools();

  const fieldChipsHTML = () => {
    const fs = c.fields || [];
    if (!fs.length) return '';
    return `<div class="adv" style="margin:0 0 16px">
      <div class="adv-head"><span class="eyebrow">이미지에 넣을 프로필 항목</span><div class="spacer"></div>
        ${fieldPick.length ? `<button class="linkish" id="fp-clear">모두 빼기</button>` : ''}</div>
      <div class="chipbar" style="margin:0">${fs.map((f, i) =>
        `<button class="chip" data-fp="${i}" aria-pressed="${fieldPick.includes(i)}">${esc(f.k || '항목')}</button>`).join('')}</div>
    </div>`;
  };
  const bindFieldChips = redraw => {
    $$('#st-body [data-fp]').forEach(b2 => b2.onclick = () => {
      const i = +b2.dataset.fp;
      fieldPick = fieldPick.includes(i) ? fieldPick.filter(x => x !== i) : [...fieldPick, i].sort((a, b3) => a - b3);
      redraw();
    });
    const fc = $('#fp-clear');
    if (fc) fc.onclick = () => { fieldPick = []; redraw(); };
  };
  const pickedFields = () => (c.fields || []).filter((f, i) => fieldPick.includes(i));

  const m = openModal({
    title: '스탯 분석',
    wide: true,
    body: `<div class="seg tabs" id="st-tabs">
        ${[['compare', '캐릭터 비교'], ['sets', '세트 모음'], ['rank', '순위']].map(([k, l]) =>
          `<button data-tab="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}
      </div>
      <div id="st-body"></div>`,
    foot: `<button class="btn btn-ghost" id="st-close">닫기</button>
           <button class="btn btn-key" id="st-img">이미지 저장</button>`,
  });

  function cmpKeys() {
    const seen = [];
    picked.forEach(id => ((state.chars.find(x => x.id === id) || {}).fields || [])
      .forEach(f => { if (f.k && !seen.includes(f.k)) seen.push(f.k); }));
    return seen;
  }

  const cmpSetObj = () => state.statSets.find(x => x.id === cmpSet) || curSet;

  function drawCompare() {
    const cs = cmpSetObj();
    const labels = cs?.labels || [], max = cs?.max || 10;
    const series = picked.map(id => {
      const p = state.chars.find(x => x.id === id);
      return { id, name: p?.name || '이름 없음', vals: p?.stats || {} };
    });
    const keys = cmpKeys();
    cmpPick = cmpPick.filter(k => keys.includes(k));
    const allTags = tagCounts(state.chars);
    cmpTags = cmpTags.filter(t => allTags.some(([n]) => n === t));
    const cands = state.chars.filter(x =>
      picked.includes(x.id) || cmpTags.every(t => (x.tags || []).includes(t)));
    $('#st-body').innerHTML = `
      <div class="set-bar">
        <select class="select" id="cmp-set">${state.statSets.map(x =>
          `<option value="${x.id}" ${x.id === cs?.id ? 'selected' : ''}>${esc(x.name)} · ${x.labels.length}항목 · 최대 ${x.max}</option>`).join('')}</select>
      </div>
      <p class="hint" style="margin:0 0 14px">비교의 기준이 될 <b>스탯 세트</b>를 고르고, 최대 3명까지 겹쳐 봐요.
        다른 세트를 쓰는 캐릭터는 같은 이름의 항목만 값이 잡히고, 없는 항목은 0으로 그려져요.
        ${esc(curSet?.name || '')} 외의 세트를 골라도 이 캐릭터의 설정은 바뀌지 않아요.</p>
      ${allTags.length ? `<div class="adv" style="margin:0 0 12px">
        <div class="adv-head"><span class="eyebrow">태그로 후보 좁히기</span><div class="spacer"></div>
          ${cmpTags.length ? `<button class="linkish" id="cmp-tclear">해제</button>` : ''}</div>
        <div class="chipbar" style="margin:0">${allTags.map(([t, n]) =>
          `<button class="chip" data-ct="${esc(t)}" aria-pressed="${cmpTags.includes(t)}">${esc(t)} ${n}</button>`).join('')}</div>
        ${cmpTags.length ? `<p class="hint">고른 태그를 <b>모두</b> 가진 캐릭터만 아래에 남아요. 이미 고른 인물은 그대로 보여요.</p>` : ''}
      </div>` : ''}
      <div class="chipbar" id="cmp-chips">${cands.length
        ? cands.map(x => `<button class="chip" data-c="${x.id}" aria-pressed="${picked.includes(x.id)}">${esc(x.name || '이름 없음')}</button>`).join('')
        : `<span class="hint" style="margin:0">이 태그 조합을 가진 캐릭터가 없어요.</span>`}</div>
      ${keys.length ? `<div class="adv" style="margin:0 0 16px">
        <div class="adv-head"><span class="eyebrow">이미지 아래에 넣을 프로필 항목</span><div class="spacer"></div>
          ${cmpPick.length ? `<button class="linkish" id="cmp-fclear">모두 빼기</button>` : ''}</div>
        <div class="chipbar" style="margin:0">${keys.map(k =>
          `<button class="chip" data-cf="${esc(k)}" aria-pressed="${cmpPick.includes(k)}">${esc(k)}</button>`).join('')}</div>
        ${cmpPick.length ? `<p class="hint">각 캐릭터의 색으로 값이 적히고, 이름은 표시하지 않아요.</p>` : ''}
      </div>` : ''}
      <div class="cmp-wrap">
        <div class="radar-box">${radarMultiSVG(labels, series, max)}</div>
        <div class="cmp-legend">
          ${series.map((sr, i) => `<div class="row">
            <span class="cmp-dot" style="background:${CMP_COLORS[i % CMP_COLORS.length]}"></span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sr.name)}</span>
            <span class="mono" style="font-size:11.5px;color:var(--faint)">${labels.reduce((n, l) => n + Number(sr.vals[l] || 0), 0)}</span>
          </div>`).join('')}
          ${labels.length ? `<table class="cmp-table"><tbody>${labels.map(l =>
            `<tr><th>${esc(l)}</th>${series.map(sr => `<td>${Number(sr.vals[l] || 0)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}
        </div>
      </div>`;
    $('#cmp-set').onchange = e2 => { cmpSet = e2.target.value; drawCompare(); };
    $$('#st-body [data-ct]').forEach(b2 => b2.onclick = () => {
      const t = b2.dataset.ct;
      cmpTags = cmpTags.includes(t) ? cmpTags.filter(x => x !== t) : [...cmpTags, t];
      drawCompare();
    });
    const tcl = $('#cmp-tclear');
    if (tcl) tcl.onclick = () => { cmpTags = []; drawCompare(); };
    $$('#st-body [data-cf]').forEach(b2 => b2.onclick = () => {
      const k = b2.dataset.cf;
      cmpPick = cmpPick.includes(k) ? cmpPick.filter(x => x !== k) : [...cmpPick, k];
      drawCompare();
    });
    const cfc = $('#cmp-fclear');
    if (cfc) cfc.onclick = () => { cmpPick = []; drawCompare(); };
    $$('#cmp-chips [data-c]').forEach(b2 => b2.onclick = () => {
      const id = b2.dataset.c;
      if (picked.includes(id)) {
        if (picked.length === 1) return toast('한 명은 남겨두세요');
        picked = picked.filter(x => x !== id);
      } else {
        if (picked.length >= 3) return toast('한 번에 3명까지 비교할 수 있어요');
        picked.push(id);
      }
      drawCompare();
    });
  }

  function drawSets() {
    const chosen = state.statSets.filter(x => setsPicked.includes(x.id));
    $('#st-body').innerHTML = `
      <p class="hint" style="margin:0 0 14px">한 캐릭터의 여러 스탯 세트를 한 장에 담아요.
        항목이 많아도 잘 보이도록 막대로 그립니다.</p>
      <div class="chipbar">${state.statSets.map(x =>
        `<button class="chip" data-s="${x.id}" aria-pressed="${setsPicked.includes(x.id)}">${esc(x.name)} · ${x.labels.length}</button>`).join('')}</div>
      ${fieldChipsHTML()}
      ${chosen.length ? chosen.map(st => `
        <div class="set-group">
          <h3>${esc(st.name)}<span class="mono">MAX ${st.max}</span></h3>
          ${st.labels.map(l => {
            const v = Number((c.stats || {})[l] || 0);
            return `<div class="bar-row">
              <span class="bar-label">${esc(l)}</span>
              <span class="bar-track"><span class="bar-fill" style="width:${Math.min(100, v / st.max * 100)}%"></span></span>
              <span class="bar-val">${v}</span></div>`;
          }).join('')}
        </div>`).join('')
      : `<p class="hint" style="margin:0">세트를 하나 이상 골라 주세요.</p>`}`;
    $$('#st-body [data-s]').forEach(b2 => b2.onclick = () => {
      const id = b2.dataset.s;
      setsPicked = setsPicked.includes(id) ? setsPicked.filter(x => x !== id) : [...setsPicked, id];
      drawSets();
    });
    bindFieldChips(drawSets);
  }

  function drawRank() {
    const info = rankInfo(rankSet);
    $('#st-body').innerHTML = `
      <p class="hint" style="margin:0 0 14px">초록 게이지는 <b>표본 평균</b>, 진한 눈금이 <b>이 캐릭터</b>예요.
        옅은 눈금(다른 캐릭터들)은 <b>표본 눈금</b> 버튼으로 끄고 켤 수 있고, 이미지에도 그대로 반영돼요.</p>
      <div class="set-bar">
        <select class="select" id="rank-set">${state.statSets.map(x =>
          `<option value="${x.id}" ${x.id === rankSet ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
        <button class="btn btn-sm" id="peer-toggle" aria-pressed="${showPeers}">표본 눈금</button>
      </div>
      ${fieldChipsHTML()}
      ${info.outside ? `<p class="hint" style="color:var(--danger);margin:0 0 12px">
        ${esc(c.name)}은(는) 이 세트를 쓰지 않아요. 비교 대상에 임시로 넣어 계산했어요.</p>` : ''}
      <div class="rank-head">
        <span>${esc(info.set?.name || '')} · 대상 ${info.pool.length}명</span>
        <b>합계 ${info.myTotal} · ${info.totalRank}위</b>
      </div>
      ${info.rows.map(r => `
        <div class="bar-row rank">
          <span class="bar-label">${esc(r.label)}</span>
          <span class="bar-track">
            <span class="bar-fill avg" style="width:${Math.min(100, r.avg / info.max * 100)}%"></span>
            ${showPeers ? r.vals.map(v => `<span class="peer-tick" style="left:${Math.min(100, v / info.max * 100)}%"></span>`).join('') : ''}
            <span class="me-tick" style="left:${Math.min(100, r.v / info.max * 100)}%"></span>
          </span>
          <span class="bar-val">${r.v}</span>
          <span class="bar-rank">${r.rank}/${r.n}위</span>
        </div>`).join('')}`;
    $('#rank-set').onchange = e => { rankSet = e.target.value; drawRank(); };
    $('#peer-toggle').onclick = () => { showPeers = !showPeers; drawRank(); };
    bindFieldChips(drawRank);
  }

  function draw() {
    $$('#st-tabs [data-tab]').forEach(b2 => b2.setAttribute('aria-pressed', b2.dataset.tab === tab));
    if (tab === 'compare') drawCompare();
    else if (tab === 'sets') drawSets();
    else drawRank();
  }
  $$('#st-tabs [data-tab]').forEach(b2 => b2.onclick = () => { tab = b2.dataset.tab; draw(); });
  draw();

  m.querySelector('#st-close').onclick = closeModal;
  m.querySelector('#st-img').onclick = () => {
    remember();
    if (tab === 'compare') {
      const cs = cmpSetObj();
      if ((cs?.labels || []).length < 3) return toast('항목이 3개 이상일 때 저장할 수 있어요', 1);
      exportCompare(cs, cs.labels, cs.max || 10, picked.map(id => {
        const p = state.chars.find(x => x.id === id);
        return {
          name: p?.name || '이름 없음', vals: p?.stats || {},
          fields: cmpPick.map(k => ({ k, v: ((p?.fields || []).find(f => f.k === k) || {}).v || '' }))
            .filter(f => f.v),
        };
      }), back);
    } else if (tab === 'sets') {
      const chosen = state.statSets.filter(x => setsPicked.includes(x.id));
      if (!chosen.length) return toast('세트를 하나 이상 골라 주세요', 1);
      exportSets(c, chosen, pickedFields(), back);
    } else {
      exportRank(c, rankInfo(rankSet), pickedFields(), showPeers, back);
    }
  };
}

/* 여러 세트를 막대로 */
async function exportSets(c, sets, fields = [], onBack) {
  toast('이미지를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const W = 1080, PAD = 84;
  const INK = '#14161A', INK2 = '#3E434B', FAINT = '#A6ABB2', HAIR = '#E5E7E8', LINE = '#D2D6D9', TEAL = '#0F4C47';
  const rows = sets.reduce((n, st) => n + st.labels.length, 0);
  const probe = document.createElement('canvas').getContext('2d');
  const flines = layoutFields(probe, fields, W - PAD * 2);
  const H = 128 + 74 + flines.length * 34 + sets.length * 92 + rows * 56 + 72;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  paperPlate(x, W, H);

  let y = 100;
  x.font = '500 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT; x.textAlign = 'left';
  x.fillText('S T A T   S E T S', PAD, y);
  x.textAlign = 'right'; x.fillStyle = INK2;
  x.fillText(fit(x, profile.nickname, 400), W - PAD, y);
  x.textAlign = 'left';
  y += 62;
  x.font = '300 46px "Noto Serif KR", serif';
  x.fillStyle = INK;
  x.fillText(fit(x, c.name || '이름 없음', W - PAD * 2), PAD, y);
  if (flines.length) {
    y = drawFieldLines(x, flines, PAD, y + 34, 34, '#787F87', INK2) - 34;
    y += 10;
  }
  y += 56;

  const trackL = PAD + 220, trackR = W - PAD - 76, trackW = trackR - trackL;
  sets.forEach(st => {
    x.font = '500 22px "IBM Plex Mono", monospace';
    x.fillStyle = TEAL;
    x.fillText(fit(x, st.name, 500), PAD, y);
    x.textAlign = 'right';
    x.font = '400 19px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.fillText('MAX ' + st.max, W - PAD, y);
    x.textAlign = 'left';
    y += 18;
    x.strokeStyle = LINE; x.lineWidth = 1.2;
    x.beginPath(); x.moveTo(PAD, y + .5); x.lineTo(W - PAD, y + .5); x.stroke();
    y += 44;

    st.labels.forEach(l => {
      const v = Number((c.stats || {})[l] || 0);
      x.font = '400 21px "Pretendard Variable", Pretendard, sans-serif';
      x.fillStyle = INK2;
      x.fillText(fit(x, l, 200), PAD, y + 6);
      x.fillStyle = HAIR;
      roundRect(x, trackL, y - 8, trackW, 16, 8); x.fill();
      const w = Math.max(0, Math.min(1, v / st.max)) * trackW;
      if (w > 0) { x.fillStyle = TEAL; roundRect(x, trackL, y - 8, Math.max(w, 16), 16, 8); x.fill(); }
      x.textAlign = 'right';
      x.font = '500 22px "IBM Plex Mono", monospace';
      x.fillStyle = TEAL;
      x.fillText(String(v), W - PAD, y + 7);
      x.textAlign = 'left';
      y += 56;
    });
    y += 30;
  });

  plateFooter(x, W, H, PAD, `${sets.length}개 세트`, fmtDate(Date.now()));
  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${(c.name || 'character').replace(/[\\/:*?"<>|\s]/g, '')}_스탯세트.png`, c.name, onBack);
  }, 'image/png');
}

/* 세트 안에서의 위치 */
async function exportRank(c, info, fields = [], showPeers = true, onBack) {
  toast('이미지를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const W = 1080, PAD = 84;
  const INK = '#14161A', INK2 = '#3E434B', FAINT = '#A6ABB2', HAIR = '#E5E7E8', LINE = '#D2D6D9', TEAL = '#0F4C47';
  const probe = document.createElement('canvas').getContext('2d');
  const flines = layoutFields(probe, fields, W - PAD * 2);
  const H = 128 + 176 + flines.length * 34 + info.rows.length * 70 + 84;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  paperPlate(x, W, H);

  let y = 100;
  x.font = '500 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT; x.textAlign = 'left';
  x.fillText('S T A T   S T A N D I N G', PAD, y);
  x.textAlign = 'right'; x.fillStyle = INK2;
  x.fillText(fit(x, profile.nickname, 400), W - PAD, y);
  x.textAlign = 'left';
  y += 62;
  x.font = '300 46px "Noto Serif KR", serif';
  x.fillStyle = INK;
  x.fillText(fit(x, c.name || '이름 없음', W - PAD * 2 - 300), PAD, y);
  x.textAlign = 'right';
  x.font = '500 26px "IBM Plex Mono", monospace';
  x.fillStyle = TEAL;
  x.fillText(`합계 ${info.myTotal} · ${info.totalRank} / ${info.pool.length}위`, W - PAD, y);
  x.textAlign = 'left';
  y += 46;
  x.font = '400 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT;
  x.fillText(`${info.set?.name || ''} 비교 · 표본 ${info.pool.length}명`, PAD, y);
  if (flines.length) y = drawFieldLines(x, flines, PAD, y + 34, 34, '#787F87', INK2) - 34;
  y += 30;
  x.strokeStyle = LINE; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(PAD, y + .5); x.lineTo(W - PAD, y + .5); x.stroke();
  y += 58;

  const trackL = PAD + 200, trackR = W - PAD - 200, trackW = trackR - trackL;
  info.rows.forEach(r => {
    x.font = '400 21px "Pretendard Variable", Pretendard, sans-serif';
    x.fillStyle = INK2;
    x.fillText(fit(x, r.label, 180), PAD, y + 6);

    // 바탕 + 평균까지의 게이지
    x.fillStyle = HAIR;
    roundRect(x, trackL, y - 8, trackW, 16, 8); x.fill();
    const aw = Math.max(0, Math.min(1, r.avg / info.max)) * trackW;
    if (aw > 0) { x.fillStyle = 'rgba(15,76,71,.30)'; roundRect(x, trackL, y - 8, Math.max(aw, 16), 16, 8); x.fill(); }

    // 표본 눈금 (익명)
    if (showPeers) r.vals.forEach(v => {
      const px = trackL + Math.max(0, Math.min(1, v / info.max)) * trackW;
      x.fillStyle = 'rgba(110,118,128,.6)';
      x.fillRect(px - 1, y - 13, 2, 26);
    });
    // 이 캐릭터의 눈금
    const mx = trackL + Math.max(0, Math.min(1, r.v / info.max)) * trackW;
    x.fillStyle = '#FFFFFF'; x.fillRect(mx - 4.5, y - 20, 9, 40);
    x.fillStyle = TEAL; x.fillRect(mx - 2, y - 18, 4, 36);
    x.beginPath(); x.moveTo(mx, y - 22); x.lineTo(mx + 6, y - 31); x.lineTo(mx - 6, y - 31);
    x.closePath(); x.fill();

    x.textAlign = 'right';
    x.font = '500 22px "IBM Plex Mono", monospace';
    x.fillStyle = TEAL;
    x.fillText(String(r.v), trackR + 56, y + 7);
    x.font = '400 20px "IBM Plex Mono", monospace';
    x.fillStyle = r.rank === 1 ? TEAL : FAINT;
    x.fillText(`${r.rank}/${r.n}위`, W - PAD, y + 7);
    x.textAlign = 'left';
    y += 70;
  });

  plateFooter(x, W, H, PAD,
    `MAX ${info.max} · 초록 = 평균 · 진한 눈금 = ${c.name || '이 캐릭터'}${showPeers ? ' · 옅은 눈금 = 표본' : ''}`,
    fmtDate(Date.now()));
  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `${(c.name || 'character').replace(/[\\/:*?"<>|\s]/g, '')}_순위.png`, c.name, onBack);
  }, 'image/png');
}

/* 이미지에 넣을 프로필 항목 — 라벨은 모노 회색, 내용은 본문색, 구분은 | */
const FL_LABEL = '400 18px "IBM Plex Mono", monospace';
const FL_VALUE = '400 21px "Pretendard Variable", Pretendard, sans-serif';
const FL_GAP = 9, FL_SEP = 30;

function layoutFields(x, fields, maxW, limit = 3) {
  const items = fields.filter(f => (f.k || '').trim() || (f.v || '').trim());
  const lines = [];
  let cur = [], w = 0;
  items.forEach(f => {
    x.font = FL_LABEL; const kw = x.measureText(f.k || '').width;
    x.font = FL_VALUE; const vw = x.measureText(f.v || '').width;
    const itemW = kw + (kw && vw ? FL_GAP : 0) + vw;
    if (cur.length && w + FL_SEP + itemW > maxW) { lines.push(cur); cur = []; w = 0; }
    w += (cur.length ? FL_SEP : 0) + itemW;
    cur.push(f);
  });
  if (cur.length) lines.push(cur);
  return lines.slice(0, limit);
}

function drawFieldLines(x, lines, left, y, lineH, faint, ink, sep = '#C3C8CB') {
  lines.forEach(line => {
    let cx = left;
    line.forEach((f, i) => {
      if (i) {
        x.font = FL_LABEL; x.fillStyle = sep;
        x.fillText('|', cx + (FL_SEP - x.measureText('|').width) / 2, y);
        cx += FL_SEP;
      }
      if (f.k) {
        x.font = FL_LABEL; x.fillStyle = faint;
        x.fillText(f.k, cx, y);
        cx += x.measureText(f.k).width + (f.v ? FL_GAP : 0);
      }
      if (f.v) {
        x.font = FL_VALUE; x.fillStyle = ink;
        x.fillText(f.v, cx, y);
        cx += x.measureText(f.v).width;
      }
    });
    y += lineH;
  });
  return y;
}

/* 공통 판면 */
function paperPlate(x, W, H) {
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  const warm = x.createLinearGradient(0, 0, 0, H);
  warm.addColorStop(0, 'rgba(251,250,247,0)'); warm.addColorStop(1, 'rgba(247,246,242,.9)');
  x.fillStyle = warm; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#E5E7E8'; x.lineWidth = 1.5;
  x.strokeRect(30.5, 30.5, W - 61, H - 61);
  x.strokeStyle = '#0F4C47'; x.lineWidth = 1.5;
  const T = 26, o = 30.5;
  [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]].forEach(([px, py, sx, sy]) => {
    x.beginPath(); x.moveTo(px + sx * T, py); x.lineTo(px, py); x.lineTo(px, py + sy * T); x.stroke();
  });
}
function plateFooter(x, W, H, PAD, left, right) {
  x.strokeStyle = '#E5E7E8'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(PAD, H - 92.5); x.lineTo(W - PAD, H - 92.5); x.stroke();
  x.font = '400 18px "IBM Plex Mono", monospace';
  x.fillStyle = '#A6ABB2';
  x.textAlign = 'left'; x.fillText(left, PAD, H - 56);
  x.textAlign = 'right'; x.fillText(right, W - PAD, H - 56);
  x.textAlign = 'left';
}

async function exportCompare(set, labels, max, series, onBack) {
  if (labels.length < 3) return toast('항목이 3개 이상일 때 저장할 수 있어요');
  toast('이미지를 그리는 중…');
  try { await document.fonts.ready; } catch {}
  const W = 1080, PAD = 84;
  const INK = '#14161A', INK2 = '#3E434B', FAINT = '#A6ABB2', HAIR = '#E5E7E8', LINE = '#D2D6D9', TEAL = '#0F4C47';
  const R = 224;
  const legendH = series.length * 44 + 18;
  const tableH = labels.length * 46 + 104;
  const probe = document.createElement('canvas').getContext('2d');
  const fieldBlocks = series.map(sr => layoutFields(probe, sr.fields || [], W - PAD * 2, 2))
    .filter(l => l.length);
  const fieldsH = fieldBlocks.length ? 34 + fieldBlocks.reduce((n, l) => n + l.length * 32 + 6, 0) + 8 : 0;
  const H = 128 + 78 + (R * 2 + 130) + legendH + tableH + fieldsH + 60;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  const warm = x.createLinearGradient(0, 0, 0, H);
  warm.addColorStop(0, 'rgba(251,250,247,0)'); warm.addColorStop(1, 'rgba(247,246,242,.9)');
  x.fillStyle = warm; x.fillRect(0, 0, W, H);
  x.strokeStyle = HAIR; x.lineWidth = 1.5;
  x.strokeRect(30.5, 30.5, W - 61, H - 61);
  x.strokeStyle = TEAL; x.lineWidth = 1.5;
  const T = 26, o = 30.5;
  [[o, o, 1, 1], [W - o, o, -1, 1], [o, H - o, 1, -1], [W - o, H - o, -1, -1]].forEach(([px, py, sx, sy]) => {
    x.beginPath(); x.moveTo(px + sx * T, py); x.lineTo(px, py); x.lineTo(px, py + sy * T); x.stroke();
  });

  let y = 100;
  x.font = '500 19px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT; x.textAlign = 'left';
  x.fillText('S T A T   C O M P A R I S O N', PAD, y);
  x.textAlign = 'right'; x.fillStyle = INK2;
  x.fillText(fit(x, profile.nickname, 400), W - PAD, y);
  y += 62;
  x.textAlign = 'left';
  x.font = '300 44px "Noto Serif KR", serif';
  x.fillStyle = INK;
  x.fillText(fit(x, set?.name || '스탯', W - PAD * 2), PAD, y);
  y += 40;

  // 그래프
  const cx = W / 2, cy = y + R + 46;
  x.save(); x.translate(cx, cy);
  const base = radarGeom(labels, {}, max, R);
  const path = k => { x.beginPath(); base.forEach((p, i) => {
    const px = Math.cos(p.a) * R * k, py = Math.sin(p.a) * R * k;
    i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.closePath(); };
  x.setLineDash([2, 5]);
  [0.25, 0.5, 0.75].forEach(k => { path(k); x.strokeStyle = LINE; x.lineWidth = 1; x.stroke(); });
  x.setLineDash([]);
  path(1); x.strokeStyle = '#C3C8CB'; x.lineWidth = 1.2; x.stroke();
  base.forEach(p => { x.beginPath(); x.moveTo(0, 0); x.lineTo(p.ax, p.ay);
    x.strokeStyle = HAIR; x.lineWidth = 1; x.stroke(); });
  series.forEach((sr, i) => {
    const g = radarGeom(labels, sr.vals, max, R);
    const col = CMP_COLORS[i % CMP_COLORS.length];
    x.beginPath();
    g.forEach((p, k) => k ? x.lineTo(p.x, p.y) : x.moveTo(p.x, p.y));
    x.closePath();
    x.fillStyle = col + '1F'; x.fill();
    x.strokeStyle = col; x.lineWidth = 2.4; x.lineJoin = 'round'; x.stroke();
    g.forEach(p => { x.beginPath(); x.arc(p.x, p.y, 5, 0, 7); x.fillStyle = col; x.fill(); });
  });
  base.forEach(p => {
    const lx = Math.cos(p.a) * (R + 42), ly = Math.sin(p.a) * (R + 42);
    x.textAlign = Math.abs(lx) < 14 ? 'center' : (lx > 0 ? 'left' : 'right');
    x.font = '400 22px "Pretendard Variable", Pretendard, sans-serif';
    x.fillStyle = INK2; x.fillText(p.label, lx, ly + 6);
  });
  x.restore();
  x.textAlign = 'left';
  y = cy + R + 84;

  // 범례
  series.forEach((sr, i) => {
    const col = CMP_COLORS[i % CMP_COLORS.length];
    x.fillStyle = col; x.fillRect(PAD, y - 14, 16, 16);
    x.font = '400 26px "Pretendard Variable", Pretendard, sans-serif';
    x.fillStyle = INK;
    x.fillText(fit(x, sr.name, W - PAD * 2 - 200), PAD + 30, y);
    x.textAlign = 'right';
    x.font = '500 22px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.fillText('합계 ' + labels.reduce((n, l) => n + Number(sr.vals[l] || 0), 0), W - PAD, y);
    x.textAlign = 'left';
    y += 44;
  });
  y += 48;

  // 표 — 굵은 선 위아래 여백을 넉넉히
  const colW = (W - PAD * 2 - 300) / series.length;
  x.strokeStyle = LINE; x.lineWidth = 1.5;
  x.beginPath(); x.moveTo(PAD, y - 52.5); x.lineTo(W - PAD, y - 52.5); x.stroke();
  labels.forEach(l => {
    const nums = series.map(sr => Number(sr.vals[l] || 0));
    const top = Math.max(...nums);
    const flat = nums.every(n => n === nums[0]);
    x.font = '400 21px "IBM Plex Mono", monospace';
    x.fillStyle = FAINT;
    x.textAlign = 'left';
    x.fillText(fit(x, l, 280), PAD, y);
    x.textAlign = 'right';
    series.forEach((sr, i) => {
      const col = CMP_COLORS[i % CMP_COLORS.length];
      const right = PAD + 300 + colW * (i + 1);
      x.font = '500 23px "IBM Plex Mono", monospace';
      x.fillStyle = col;
      const txt = String(nums[i]);
      x.fillText(txt, right, y);
      if (!flat && nums[i] === top && top > 0) {      // 가장 높은 값 왼쪽에 작은 표식
        const tx = right - x.measureText(txt).width - 15;
        x.beginPath();
        x.moveTo(tx + 5, y - 15); x.lineTo(tx + 10, y - 6); x.lineTo(tx, y - 6);
        x.closePath(); x.fillStyle = col; x.fill();
      }
    });
    x.textAlign = 'left';
    x.strokeStyle = HAIR; x.lineWidth = 1;
    x.beginPath(); x.moveTo(PAD, y + 16.5); x.lineTo(W - PAD, y + 16.5); x.stroke();
    y += 46;
  });

  // 캐릭터별 프로필 항목 — 각자의 색 띠로
  if (fieldBlocks.length) {
    y += 30;
    series.forEach(sr => {
      const lines = layoutFields(probe, sr.fields || [], W - PAD * 2, 2);
      if (!lines.length) return;
      const col = CMP_COLORS[series.indexOf(sr) % CMP_COLORS.length];
      const bx = PAD - 22, bw = W - (PAD - 22) * 2;
      const bh = lines.length * 32 + 20, top = y - 26;
      const wash = x.createLinearGradient(bx, 0, bx + bw, 0);   // 오른쪽으로 갈수록 옅어져요
      wash.addColorStop(0, col + '18');
      wash.addColorStop(.55, col + '0C');
      wash.addColorStop(1, col + '05');
      x.fillStyle = wash; x.fillRect(bx, top, bw, bh);
      x.fillStyle = col; x.fillRect(bx, top, 3, bh);          // 왼쪽 색 세로선
      drawFieldLines(x, lines, PAD, y, 32, col, INK2, col + '3A');
      y = top + bh + 12;
    });
  }

  x.font = '400 18px "IBM Plex Mono", monospace';
  x.fillStyle = FAINT;
  x.textAlign = 'left';
  x.fillText(`${set?.name || ''} · MAX ${max}`, PAD, H - 60);
  x.textAlign = 'right';
  x.fillText(fmtDate(Date.now()), W - PAD, H - 60);

  cv.toBlob(b => {
    if (!b) return toast('이미지를 만들지 못했어요', 1);
    showImageModal(b, `스탯비교_${series.map(s => s.name).join('-').replace(/[\/:*?"<>|\s]/g, '')}.png`, '스탯 비교', onBack);
  }, 'image/png');
}

/* ════════ 캐릭터 상세 ════════ */
async function openCharacter(id) {
  const c = state.chars.find(x => x.id === id);
  if (!c) return renderGallery();
  state.view = 'character'; state.current = c; state.fullImg = null; state.excerpts = [];
  state.exQ = ''; state.exFolder = null; state.exTags = []; state.exAdv = false; state.exSort = 'recent';
  window.scrollTo(0, 0);
  renderCharacter();
  const [full] = await Promise.all([loadFullImage(c.imageId), loadExcerpts(id)]);
  state.fullImg = full;
  if (state.current?.id === id) renderCharacter();
}

  $('#compare-stats').onclick = () => openStatTools(state.chars.length > 1 ? 'compare' : 'sets');
  $('#add-excerpt').onclick = () => openExcerptEditor(null);
  $('#manage-folders').onclick = openFolders;
  $('#read-all').onclick = () => openContinuous();
  $('#ex-trash')?.addEventListener('click', openExcerptTrash);
  $('#pin').onclick = async () => {

    await F.updateDoc(ref('characters', c.id), { pinned: c.pinned });
    $('#pin').textContent = c.pinned ? '★' : '☆';
    toast(c.pinned ? '상단에 고정했어요' : '고정을 해제했어요');
  };
  const applySet = async id => {
    c.statSetId = id;
    await F.updateDoc(ref('characters', c.id), { statSetId: id, updatedAt: Date.now() });
    renderCharacter();
  };
  $('#set-select').onchange = e => applySet(e.target.value);
  $('#set-prev')?.addEventListener('click', () => applySet(prevSet.id));
  $('#set-next')?.addEventListener('click', () => applySet(nextSet.id));
  $('#char-prev')?.addEventListener('click', () => prevChar && openCharacter(prevChar.id));
  $('#char-next')?.addEventListener('click', () => nextChar && openCharacter(nextChar.id));

let statTimer = null;
function bindStatSliders(labels, max) {
  const c = state.current;
  $$('#stat-list input[type=range]').forEach(inp => {
    inp.oninput = () => {
      const i = +inp.dataset.i, l = labels[i], v = Number(inp.value);
      c.stats = { ...(c.stats || {}), [l]: v };
      $('#v-' + i).textContent = v;
      $('#radar-box').innerHTML = radarSVG(labels, c.stats, max);
      clearTimeout(statTimer);
      statTimer = setTimeout(async () => {
        await F.updateDoc(ref('characters', c.id), { stats: c.stats, updatedAt: Date.now() });
        c.updatedAt = Date.now();
      }, 600);
    };
  });
}

async function removeCharacter(c) {
  const name = c.name || '이름 없음';
  if (!await confirmDialog('휴지통으로 보낼까요?',
    `${name} 을(를) 휴지통으로 옮겨요. 목록에서는 사라지지만 휴지통에서 되돌릴 수 있어요.`, '휴지통으로')) return;
  try {
    await F.updateDoc(ref('characters', c.id), { deleted: true, deletedAt: Date.now() });
    c.deleted = true; c.deletedAt = Date.now();
    state.chars = state.chars.filter(x => x.id !== c.id);
    state.trash = [c, ...state.trash];
    toast('휴지통으로 옮겼어요');
    renderGallery();
  } catch (e) { toast('옮기지 못했어요: ' + (e.code || e.message), 1); }
}

/* 휴지통 */
function openTrash() {
  const m = openModal({
    title: '휴지통',
    wide: true,
    body: `<p class="hint" style="margin:0 0 16px">지운 캐릭터가 모여요. 되돌리면 발췌와 스탯까지 그대로 돌아옵니다.
      자동으로 사라지지는 않으니, 확실할 때 영구 삭제해 주세요.</p>
      <div id="tr-list"></div>`,
    foot: `<button class="btn" id="tr-close">닫기</button>`,
  });
  function draw() {
    const w = m.querySelector('#tr-list');
    if (!state.trash.length) { w.innerHTML = `<p class="hint" style="margin:0">휴지통이 비어 있어요.</p>`; return; }
    w.innerHTML = state.trash.map(c => `
      <div class="rel-item" style="cursor:default">
        <span class="rel-thumb">${c.thumb ? `<img src="${c.thumb}" alt="">` : ''}</span>
        <span class="rel-info">
          <b>${esc(c.name || '이름 없음')}</b>
          <span>${fmtDate(c.deletedAt)}에 지움${c.excerptCount ? ` · 발췌 ${c.excerptCount}` : ''}</span>
        </span>
        <button class="btn btn-sm" data-restore="${c.id}">되돌리기</button>
        <button class="btn btn-sm btn-danger" data-purge="${c.id}">영구 삭제</button>
      </div>`).join('');
    w.querySelectorAll('[data-restore]').forEach(el => el.onclick = async () => {
      const c = state.trash.find(x => x.id === el.dataset.restore);
      try {
        await F.updateDoc(ref('characters', c.id), { deleted: false, deletedAt: null });
        delete c.deleted;
        state.trash = state.trash.filter(x => x.id !== c.id);
        state.chars.push(c);
        draw(); renderGallery(); toast('되돌렸어요');
      } catch (e) { toast('되돌리지 못했어요: ' + (e.code || e.message), 1); }
    });
    w.querySelectorAll('[data-purge]').forEach(el => el.onclick = async () => {
      const c = state.trash.find(x => x.id === el.dataset.purge);
      const name = c.name || '이름 없음';
      if (!await confirmTypeDialog('영구 삭제할까요?',
        '프로필과 세부 묘사, 스탯, 발췌가 완전히 지워져요. 되돌릴 수 없어요.', name, '영구 삭제')) return openTrash();
      try {
        const snap = await F.getDocs(col('characters', c.id, 'excerpts'));
        for (const d of snap.docs) await F.deleteDoc(ref('characters', c.id, 'excerpts', d.id));
        if (c.imageId) await F.deleteDoc(ref('images', c.imageId)).catch(() => {});
        for (const other of state.chars) {
          if (!(other.relations || []).some(r => r.id === c.id)) continue;
          const list = other.relations.filter(r => r.id !== c.id);
          await F.updateDoc(ref('characters', other.id), { relations: list }).catch(() => {});
          other.relations = list;
        }
        await F.deleteDoc(ref('characters', c.id));
        state.trash = state.trash.filter(x => x.id !== c.id);
        openTrash(); renderGallery(); toast('영구 삭제했어요');
      } catch (e) { toast('삭제하지 못했어요: ' + (e.code || e.message), 1); }
    });
  }
  draw();
  m.querySelector('#tr-close').onclick = closeModal;
}

/* 발췌 휴지통 */
function openExcerptTrash() {
  const m = openModal({
    title: '발췌 휴지통',
    wide: true,
    body: `<p class="hint" style="margin:0 0 16px">이 캐릭터에서 지운 발췌예요.</p><div id="etr-list"></div>`,
    foot: `<button class="btn" id="etr-close">닫기</button>`,
  });
  function draw() {
    const w = m.querySelector('#etr-list');
    if (!state.exTrash.length) { w.innerHTML = `<p class="hint" style="margin:0">비어 있어요.</p>`; return; }
    w.innerHTML = state.exTrash.map(e => `
      <div class="notice-row">
        <b style="font-family:var(--serif);font-size:15.5px">${esc(e.title || '제목 없음')}</b>
        <p class="hint" style="margin:6px 0 0">${esc((e.body || '').slice(0, 90))}</p>
        <div class="row-meta">
          <span class="mono">${fmtDate(e.deletedAt)}에 지움</span><div class="spacer"></div>
          <button class="btn btn-sm" data-erestore="${e.id}">되돌리기</button>
          <button class="btn btn-sm btn-danger" data-epurge="${e.id}">영구 삭제</button>
        </div>
      </div>`).join('');
    w.querySelectorAll('[data-erestore]').forEach(el => el.onclick = async () => {
      const e = state.exTrash.find(x => x.id === el.dataset.erestore);
      await F.updateDoc(ref('characters', state.current.id, 'excerpts', e.id), { deleted: false, deletedAt: null });
      await refreshExcerpts(); draw(); toast('되돌렸어요');
    });
    w.querySelectorAll('[data-epurge]').forEach(el => el.onclick = async () => {
      const e = state.exTrash.find(x => x.id === el.dataset.epurge);
      if (!await confirmDialog('영구 삭제할까요?', `"${e.title || '제목 없음'}" 을 완전히 지워요.`)) return openExcerptTrash();
      await F.deleteDoc(ref('characters', state.current.id, 'excerpts', e.id));
      await refreshExcerpts(); openExcerptTrash(); toast('영구 삭제했어요');
    });
  }
  draw();
  m.querySelector('#etr-close').onclick = closeModal;
}

/* ════════ 캐릭터 편집 ════════ */
function openCharEditor(c) {
  const isNew = !c;
  const draft = {
    name: c?.name || '', subtitle: c?.subtitle || '',
    tags: (c?.tags || []).join(' '),
    fields: (c?.fields || []).map(f => ({ ...f })),
    details: (c?.details || []).map(d => ({ ...d, subs: (d.subs || []).map(sb => ({ ...sb })) })),
    statSetId: c?.statSetId || state.statSets[0]?.id || '',
    thumb: c?.thumb || null, imageId: c?.imageId || null,
    newFull: null, removedImg: false,
  };
  if (!draft.fields.length) draft.fields = [{ k: '', v: '' }];
  const preview = state.fullImg || draft.thumb;

  const m = openModal({
    title: isNew ? '캐릭터 추가' : '프로필 수정',
    wide: true,
    body: `
      <div class="drop" id="drop">
        <div id="drop-inner">${preview ? `<img src="${preview}" alt="">` : ''}
          <div>${preview ? '탭해서 이미지 바꾸기' : '탭해서 대표 이미지 선택'}</div></div>
        <input type="file" accept="image/*" id="file" class="sr">
      </div>
      ${preview ? `<button class="btn btn-sm btn-ghost" id="rm-img" style="margin:8px 0 0">이미지 지우기</button>` : ''}
      <div style="height:16px"></div>
      <label class="field"><span>이름</span>
        <input class="input" id="f-name" value="${esc(draft.name)}" placeholder="캐릭터 이름" maxlength="60"></label>
      <label class="field"><span>부제</span>
        <input class="input" id="f-sub" value="${esc(draft.subtitle)}" placeholder="한 줄 설명 · 이명 · 소속" maxlength="80"></label>
      <label class="field"><span>태그</span>
        <input class="input" id="f-tags" value="${esc(draft.tags)}" placeholder="띄어쓰기로 구분 (예: 주인공 검사 북부)">
        <div class="tag-sug" id="f-tags-sug"></div>
        <p class="hint">띄어쓰기로 나눈 단어가 각각 태그가 돼요. 고급 검색에 쓰입니다.</p></label>
      <label class="field"><span>스탯 세트</span>
        <select class="select" id="f-set">
          ${state.statSets.map(s => `<option value="${s.id}" ${s.id === draft.statSetId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
        </select>
        <p class="hint">이 캐릭터의 스탯을 어떤 항목 묶음으로 기록할지 고르는 칸이에요.
          값은 저장 후 스탯 패널에서 넣고, 세트는 거기서도 바꿀 수 있어요.</p></label>
      <div class="field"><span>서식</span>
        <div class="preset-bar">
          <button class="btn btn-sm" id="ps-base">기본 서식 불러오기</button>
          <button class="btn btn-sm" id="ps-mine">내 서식 불러오기</button>
          <button class="btn btn-sm btn-ghost" id="ps-save">지금 제목을 내 서식으로</button>
        </div>
        <p class="hint">아래 프로필 항목과 세부 묘사의 <b>제목만</b> 채워요.
          이미 있는 제목과 적어둔 내용은 그대로 두고, 없는 제목만 새로 붙습니다.</p>
      </div>
      <div class="field"><span>프로필 항목</span>
        <div id="kv-wrap"></div>
        <button class="btn btn-sm btn-ghost" id="add-kv" style="margin-top:4px">＋ 항목 추가</button>
        <p class="hint">왼쪽은 항목 이름(나이, 키, 성격…), 오른쪽은 내용이에요.
          <b>◉</b>를 눌러 <b>◌</b>로 바꾸면 그 항목은 카드 이미지에서 빠집니다.</p>
      </div>
      <div class="field"><span>세부 묘사</span>
        <div id="det-wrap"></div>
        <button class="btn btn-sm btn-ghost" id="add-det" style="margin-top:4px">＋ 묘사 추가</button>
        <p class="hint">제목을 달아 길게 풀어 쓰는 칸이에요. 카드 이미지에는 포함되지 않아요.
          긴 글은 캐릭터 화면의 <b>묘사 수정</b>에서 더 넓게 쓸 수 있고, <b>**굵게**</b> 같은 마크다운도 거기 안내가 있어요.</p>
      </div>`,
    foot: `<button class="btn btn-ghost" id="cancel">취소</button>
           <button class="btn btn-key" id="save">${isNew ? '만들기' : '저장'}</button>`,
  });

  bindTagSuggest(m.querySelector('#f-tags'), m.querySelector('#f-tags-sug'), tagCounts(state.chars));

  const detWrap = m.querySelector('#det-wrap');
  function drawDet() {
    detWrap.innerHTML = draft.details.map((d, i) => `
      <div class="det-row">
        <div class="det-top">
          <input class="input" data-dt="${i}" value="${esc(d.t)}" placeholder="제목 (예: 외모 · 말버릇 · 과거)" maxlength="40">
          <span class="ord">
            <button data-dup="${i}" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button data-ddn="${i}" title="아래로" ${i === draft.details.length - 1 ? 'disabled' : ''}>▼</button>
          </span>
          <button class="icon-btn" data-drm="${i}" title="이 묘사 지우기">✕</button>
        </div>
        <textarea class="textarea" data-dv="${i}" style="min-height:110px;font-size:14px"
          placeholder="길게 풀어 써도 괜찮아요.">${esc(d.v)}</textarea>
        ${(d.subs || []).map((sb, j) => `
          <div class="sub-edit">
            <div class="det-top">
              <input class="input" data-st="${i}.${j}" value="${esc(sb.t)}" placeholder="세부 제목" maxlength="40">
              <span class="ord">
                <button data-sup="${i}.${j}" title="위로" ${j === 0 ? 'disabled' : ''}>▲</button>
                <button data-sdn="${i}.${j}" title="아래로" ${j === d.subs.length - 1 ? 'disabled' : ''}>▼</button>
              </span>
              <button class="icon-btn" data-srm="${i}.${j}" title="세부 제목 지우기">✕</button>
            </div>
            <textarea class="textarea" data-sv="${i}.${j}" style="min-height:80px;font-size:13.5px"
              placeholder="이 세부 제목 안에 들어갈 내용.">${esc(sb.v)}</textarea>
          </div>`).join('')}
        <button class="btn btn-sm btn-ghost" data-addsub="${i}" style="margin-top:2px">＋ 세부 제목</button>
      </div>`).join('');
    const pair = v => v.split('.').map(Number);
    detWrap.querySelectorAll('[data-dt]').forEach(el => el.oninput = ev => draft.details[+el.dataset.dt].t = ev.target.value);
    detWrap.querySelectorAll('[data-dv]').forEach(el => el.oninput = ev => draft.details[+el.dataset.dv].v = ev.target.value);
    detWrap.querySelectorAll('[data-st]').forEach(el => el.oninput = ev => {
      const [i, j] = pair(el.dataset.st); draft.details[i].subs[j].t = ev.target.value;
    });
    detWrap.querySelectorAll('[data-sv]').forEach(el => el.oninput = ev => {
      const [i, j] = pair(el.dataset.sv); draft.details[i].subs[j].v = ev.target.value;
    });
    detWrap.querySelectorAll('[data-srm]').forEach(el => el.onclick = async () => {
      const [i, j] = pair(el.dataset.srm);
      const sb = draft.details[i].subs[j] || {};
      if (((sb.t || '').trim() || (sb.v || '').trim())
        && !await confirmMini(`세부 제목 <b>${esc(snip(sb.t, 18) || '제목 없음')}</b> 을(를) 지울까요?${
          (sb.v || '').trim() ? `<br>안에 적은 ${String(sb.v).length}자도 함께 사라져요.` : ''}`)) return;
      draft.details[i].subs.splice(j, 1); drawDet();
    });
    detWrap.querySelectorAll('[data-addsub]').forEach(el => el.onclick = () => {
      const i = +el.dataset.addsub;
      draft.details[i].subs = [...(draft.details[i].subs || []), { t: '', v: '' }];
      drawDet();
    });
    detWrap.querySelectorAll('[data-drm]').forEach(el => el.onclick = async () => {
      const i = +el.dataset.drm, d = draft.details[i] || {};
      const bulk = String(d.v || '').length + (d.subs || []).reduce((n, sb) => n + String(sb.v || '').length, 0);
      if (((d.t || '').trim() || bulk)
        && !await confirmMini(`세부 묘사 <b>${esc(snip(d.t, 18) || '제목 없음')}</b> 을(를) 지울까요?${
          bulk ? `<br>본문 ${bulk}자${(d.subs || []).length ? ` · 세부 제목 ${d.subs.length}개` : ''}가 함께 사라져요.` : ''}`)) return;
      draft.details.splice(i, 1); drawDet();
    });
    detWrap.querySelectorAll('[data-dup]').forEach(el => el.onclick = () => { move(draft.details, +el.dataset.dup, -1); drawDet(); });
    detWrap.querySelectorAll('[data-ddn]').forEach(el => el.onclick = () => { move(draft.details, +el.dataset.ddn, 1); drawDet(); });
    detWrap.querySelectorAll('[data-sup]').forEach(el => el.onclick = () => {
      const [i, j] = pair(el.dataset.sup); move(draft.details[i].subs, j, -1); drawDet();
    });
    detWrap.querySelectorAll('[data-sdn]').forEach(el => el.onclick = () => {
      const [i, j] = pair(el.dataset.sdn); move(draft.details[i].subs, j, 1); drawDet();
    });
  }
  drawDet();
  m.querySelector('#add-det').onclick = () => { draft.details.push({ t: '', v: '', subs: [] }); drawDet(); };

  /* 서식 적용 — 제목만 채우고 기존 내용은 건드리지 않아요 */
  function applyPreset(preset) {
    const has = (arr, k, key) => arr.some(o => (o[key] || '').trim() === k);
    (preset.fields || []).forEach(k => { if (k && !has(draft.fields, k, 'k')) draft.fields.push({ k, v: '' }); });
    (preset.details || []).forEach(t => { if (t && !has(draft.details, t, 't')) draft.details.push({ t, v: '' }); });
    draft.fields = draft.fields.filter(f => f.k.trim() || f.v.trim());
    if (!draft.fields.length) draft.fields.push({ k: '', v: '' });
    draft.details = draft.details.filter(d => d.t.trim() || d.v.trim());
    drawKV(); drawDet();
    toast('서식을 불러왔어요');
  }
  m.querySelector('#ps-base').onclick = () => applyPreset(BASE_PRESET);
  m.querySelector('#ps-mine').onclick = () => {
    if (!profile.formPreset) return toast('저장해둔 서식이 없어요. 제목을 채운 뒤 "내 서식으로"를 눌러 보세요');
    applyPreset(profile.formPreset);
  };
  m.querySelector('#ps-save').onclick = async () => {
    const preset = {
      fields: draft.fields.map(f => f.k.trim()).filter(Boolean),
      details: draft.details.map(d => d.t.trim()).filter(Boolean),
    };
    if (!preset.fields.length && !preset.details.length) return toast('저장할 제목이 없어요', 1);
    try {
      await F.setDoc(F.doc(db, 'users', uid), { formPreset: preset }, { merge: true });
      profile.formPreset = preset;
      toast(`내 서식으로 저장했어요 · 프로필 ${preset.fields.length} · 묘사 ${preset.details.length}`);
    } catch (e) { toast('저장하지 못했어요: ' + (e.code || e.message), 1); }
  };

  const kvWrap = m.querySelector('#kv-wrap');
  function drawKV() {
    kvWrap.innerHTML = draft.fields.map((f, i) => `
      <div class="kv-row">
        <input class="input" data-k="${i}" value="${esc(f.k)}" placeholder="항목" maxlength="24">
        <input class="input" data-v="${i}" value="${esc(f.v)}" placeholder="내용" maxlength="300">
        <span class="ord">
          <button data-kup="${i}" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button data-kdn="${i}" title="아래로" ${i === draft.fields.length - 1 ? 'disabled' : ''}>▼</button>
        </span>
        <button class="icon-btn img-toggle" data-hide="${i}" aria-pressed="${f.hide ? 'true' : 'false'}"
          title="${f.hide ? '카드 이미지에서 숨김' : '카드 이미지에 표시'}">${f.hide ? '◌' : '◉'}</button>
        <button class="icon-btn" data-rm="${i}" title="이 항목 지우기">✕</button>
      </div>`).join('');
    kvWrap.querySelectorAll('[data-kup]').forEach(el => el.onclick = () => { move(draft.fields, +el.dataset.kup, -1); drawKV(); });
    kvWrap.querySelectorAll('[data-kdn]').forEach(el => el.onclick = () => { move(draft.fields, +el.dataset.kdn, 1); drawKV(); });
    kvWrap.querySelectorAll('[data-hide]').forEach(el => el.onclick = () => {
      const f = draft.fields[+el.dataset.hide];
      f.hide = !f.hide; drawKV();
    });
    kvWrap.querySelectorAll('[data-k]').forEach(el => el.oninput = e => draft.fields[+el.dataset.k].k = e.target.value);
    kvWrap.querySelectorAll('[data-v]').forEach(el => el.oninput = e => draft.fields[+el.dataset.v].v = e.target.value);
    kvWrap.querySelectorAll('[data-rm]').forEach(el => el.onclick = async () => {
      const i = +el.dataset.rm, f = draft.fields[i] || {};
      const filled = (f.k || '').trim() || (f.v || '').trim();
      if (filled && !await confirmMini(`프로필 항목 <b>${esc(snip(f.k, 18) || '제목 없음')}</b> 을(를) 지울까요?${
        (f.v || '').trim() ? `<br><span class="q">${esc(snip(f.v, 40))}</span>` : ''}`)) return;
      draft.fields.splice(i, 1);
      if (!draft.fields.length) draft.fields.push({ k: '', v: '' });
      drawKV();
    });
  }
  drawKV();
  m.querySelector('#add-kv').onclick = () => { draft.fields.push({ k: '', v: '' }); drawKV(); };

  const fileInput = m.querySelector('#file');
  m.querySelector('#drop').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const f = fileInput.files[0]; if (!f) return;
    m.querySelector('#drop-inner').innerHTML = '<div>이미지 정리하는 중…</div>';
    try {
      const [thumb, full] = await Promise.all([compress(f, 420, .68), compressFit(f, 1280, 860000)]);
      draft.thumb = thumb; draft.newFull = full; draft.removedImg = false;
      m.querySelector('#drop-inner').innerHTML = `<img src="${thumb}" alt=""><div>탭해서 이미지 바꾸기</div>`;
    } catch (e) {
      m.querySelector('#drop-inner').innerHTML = '<div>이미지를 읽지 못했어요. 다른 파일로 시도해 주세요.</div>';
    }
  };
  m.querySelector('#rm-img')?.addEventListener('click', () => {
    draft.thumb = null; draft.newFull = null; draft.removedImg = true;
    m.querySelector('#drop-inner').innerHTML = '<div>탭해서 대표 이미지 선택</div>';
    m.querySelector('#rm-img').remove();
  });

  m.querySelector('#cancel').onclick = closeModal;
  m.querySelector('#save').onclick = async () => {
    const btn = m.querySelector('#save');
    btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      const now = Date.now();
      const data = {
        name: m.querySelector('#f-name').value.trim() || '이름 없음',
        subtitle: m.querySelector('#f-sub').value.trim(),
        tags: m.querySelector('#f-tags').value.trim().split(/\s+/).filter(Boolean).slice(0, 20),
        fields: draft.fields.filter(f => f.k.trim() || f.v.trim())
          .map(f => ({ k: f.k.trim(), v: f.v.trim(), hide: !!f.hide })),
        details: draft.details.filter(d => d.t.trim() || d.v.trim() || (d.subs || []).some(sb => sb.t.trim() || sb.v.trim()))
          .map(d => ({
            t: d.t.trim(), v: d.v.replace(/\s+$/, ''),
            subs: (d.subs || []).filter(sb => sb.t.trim() || sb.v.trim())
              .map(sb => ({ t: sb.t.trim(), v: sb.v.replace(/\s+$/, '') })),
          })),
        statSetId: m.querySelector('#f-set').value,
        thumb: draft.thumb || null,
        updatedAt: now,
      };
      const id = c?.id || uidgen();
      if (!c) { data.createdAt = now; data.stats = {}; data.pinned = false; data.excerptCount = 0; }

      if (draft.newFull) {
        const imgId = c?.imageId || uidgen();
        await F.setDoc(ref('images', imgId), { data: draft.newFull, updatedAt: now });
        data.imageId = imgId;
        state.fullImg = draft.newFull;
      } else if (draft.removedImg) {
        if (c?.imageId) await F.deleteDoc(ref('images', c.imageId)).catch(() => {});
        data.imageId = null; state.fullImg = null;
      }

      await F.setDoc(ref('characters', id), data, { merge: true });
      const merged = { ...(c || {}), id, ...data };
      const i = state.chars.findIndex(x => x.id === id);
      if (i >= 0) state.chars[i] = merged; else state.chars.push(merged);
      closeModal();
      toast(c ? '저장했어요' : '캐릭터를 만들었어요');
      if (c) { state.current = merged; renderCharacter(); }
      else openCharacter(id);
    } catch (e) {
      btn.disabled = false; btn.textContent = isNew ? '만들기' : '저장';
      toast('저장하지 못했어요: ' + (e.code || e.message), 1);
    }
  };
}

/* ════════ 세부 묘사 전용 편집 ════════ */
function openDetailEditor(c) {
  const draft = (c.details || []).map(d => ({
    t: d.t || '', v: d.v || '',
    subs: (d.subs || []).map(sb => ({ t: sb.t || '', v: sb.v || '' })),
  }));
  if (!draft.length) draft.push({ t: '', v: '', subs: [] });
  let preview = false;

  const m = openModal({
    title: '세부 묘사 수정',
    wide: true,
    body: `<p class="hint" style="margin:0 0 14px">이 창은 <b>세부 묘사만</b> 고쳐요.
        이름 · 태그 · 프로필 항목은 그대로 <b>프로필 수정</b>에서 다룹니다.
        아래 표기법대로 적으면 저장한 뒤 서식으로 보여요.</p>
      <div id="dte-wrap" class="det-editor"></div>
      <button class="btn btn-sm btn-ghost" id="dte-add" style="margin-top:4px">＋ 묘사 추가</button>
      <details class="setup-more" id="dte-help" style="margin-top:18px">
        <summary>마크다운 표기법</summary>
        <p class="md-help" style="margin:13px 0 0">
          <code>**굵게**</code> <code>*기울임*</code> <code>__밑줄__</code>
          <code>~~취소선~~</code> <code>==형광==</code> <code>\`고정폭\`</code><br>
          <code># 소제목</code> — <code>#</code> 이 늘어날수록 작아져요 (<code>###</code> 까지)<br>
          <code>- 목록</code> · <code>1. 번호 목록</code> · <code>&gt; 인용</code> · <code>---</code> 가로줄<br>
          빈 줄은 문단을 나누고, 그 밖의 줄바꿈은 그대로 유지돼요.
        </p></details>`,
    foot: `<button class="btn btn-ghost" id="dte-cancel">취소</button>
           <button class="btn btn-sm" id="dte-prev" aria-pressed="false">미리보기</button>
           <button class="btn btn-key" id="dte-save">저장</button>`,
  });

  const wrap = m.querySelector('#dte-wrap');
  const pair = v => v.split('.').map(Number);

  function drawPreview() {
    const live = draft.filter(d => d.t.trim() || d.v.trim() || d.subs.some(sb => sb.t.trim() || sb.v.trim()));
    wrap.innerHTML = live.length ? live.map(d => `
      <div class="detail-item">
        <div class="det-title">${esc(d.t || '제목 없음')}</div>
        ${d.v.trim() ? `<div class="md">${mdHTML(d.v)}</div>` : ''}
        ${d.subs.length ? `<div class="sub-list">${d.subs.map(sb => `
          <div class="sub-item">
            <div style="font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--teal);padding:9px 0 0">
              ${esc(sb.t || '세부 제목')}</div>
            <div class="md">${mdHTML(sb.v)}</div>
          </div>`).join('')}</div>` : ''}
      </div>`).join('') : `<p class="hint" style="margin:0">아직 보여줄 내용이 없어요.</p>`;
  }

  function drawDte() {
    if (preview) return drawPreview();
    wrap.innerHTML = draft.map((d, i) => `
      <div class="det-row">
        <div class="det-top">
          <input class="input" data-dt="${i}" value="${esc(d.t)}" placeholder="제목 (예: 외모 · 말버릇 · 과거)" maxlength="40">
          <span class="ord">
            <button data-dup="${i}" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button data-ddn="${i}" title="아래로" ${i === draft.length - 1 ? 'disabled' : ''}>▼</button>
          </span>
          <button class="icon-btn" data-drm="${i}" title="이 묘사 지우기">✕</button>
        </div>
        ${mdBarHTML('dte-v-' + i)}
        <textarea class="textarea" id="dte-v-${i}" data-dv="${i}" style="min-height:250px"
          placeholder="길게 풀어 써도 괜찮아요.">${esc(d.v)}</textarea>
        ${d.subs.map((sb, j) => `
          <div class="sub-edit">
            <div class="det-top">
              <input class="input" data-st="${i}.${j}" value="${esc(sb.t)}" placeholder="세부 제목" maxlength="40">
              <span class="ord">
                <button data-sup="${i}.${j}" title="위로" ${j === 0 ? 'disabled' : ''}>▲</button>
                <button data-sdn="${i}.${j}" title="아래로" ${j === d.subs.length - 1 ? 'disabled' : ''}>▼</button>
              </span>
              <button class="icon-btn" data-srm="${i}.${j}" title="세부 제목 지우기">✕</button>
            </div>
            ${mdBarHTML(`dte-s-${i}-${j}`)}
            <textarea class="textarea" id="dte-s-${i}-${j}" data-sv="${i}.${j}"
              style="min-height:170px;font-size:13.5px"
              placeholder="이 세부 제목 안에 들어갈 내용.">${esc(sb.v)}</textarea>
          </div>`).join('')}
        <button class="btn btn-sm btn-ghost" data-addsub="${i}" style="margin-top:2px">＋ 세부 제목</button>
      </div>`).join('');

    wrap.querySelectorAll('[data-mdt]').forEach(el => el.onclick = () => {
      const ta = wrap.querySelector('#' + el.dataset.mdfor);
      if (ta) applyMdTool(ta, MD_TOOLS[+el.dataset.mdt]);
    });
    wrap.querySelectorAll('[data-dt]').forEach(el => el.oninput = ev => draft[+el.dataset.dt].t = ev.target.value);
    wrap.querySelectorAll('[data-dv]').forEach(el => el.oninput = ev => draft[+el.dataset.dv].v = ev.target.value);
    wrap.querySelectorAll('[data-st]').forEach(el => el.oninput = ev => {
      const [i, j] = pair(el.dataset.st); draft[i].subs[j].t = ev.target.value;
    });
    wrap.querySelectorAll('[data-sv]').forEach(el => el.oninput = ev => {
      const [i, j] = pair(el.dataset.sv); draft[i].subs[j].v = ev.target.value;
    });
    wrap.querySelectorAll('[data-addsub]').forEach(el => el.onclick = () => {
      draft[+el.dataset.addsub].subs.push({ t: '', v: '' }); drawDte();
    });
    wrap.querySelectorAll('[data-srm]').forEach(el => el.onclick = async () => {
      const [i, j] = pair(el.dataset.srm);
      const sb = draft[i].subs[j] || {};
      if ((sb.t.trim() || sb.v.trim())
        && !await confirmMini(`세부 제목 <b>${esc(snip(sb.t, 18) || '제목 없음')}</b> 을(를) 지울까요?${
          sb.v.trim() ? `<br>안에 적은 ${sb.v.length}자도 함께 사라져요.` : ''}`)) return;
      draft[i].subs.splice(j, 1); drawDte();
    });
    wrap.querySelectorAll('[data-drm]').forEach(el => el.onclick = async () => {
      const i = +el.dataset.drm, d = draft[i] || { t: '', v: '', subs: [] };
      const bulk = d.v.length + d.subs.reduce((n, sb) => n + sb.v.length, 0);
      if ((d.t.trim() || bulk)
        && !await confirmMini(`세부 묘사 <b>${esc(snip(d.t, 18) || '제목 없음')}</b> 을(를) 지울까요?${
          bulk ? `<br>본문 ${bulk}자${d.subs.length ? ` · 세부 제목 ${d.subs.length}개` : ''}가 함께 사라져요.` : ''}`)) return;
      draft.splice(i, 1);
      if (!draft.length) draft.push({ t: '', v: '', subs: [] });
      drawDte();
    });
    wrap.querySelectorAll('[data-dup]').forEach(el => el.onclick = () => { move(draft, +el.dataset.dup, -1); drawDte(); });
    wrap.querySelectorAll('[data-ddn]').forEach(el => el.onclick = () => { move(draft, +el.dataset.ddn, 1); drawDte(); });
    wrap.querySelectorAll('[data-sup]').forEach(el => el.onclick = () => {
      const [i, j] = pair(el.dataset.sup); move(draft[i].subs, j, -1); drawDte();
    });
    wrap.querySelectorAll('[data-sdn]').forEach(el => el.onclick = () => {
      const [i, j] = pair(el.dataset.sdn); move(draft[i].subs, j, 1); drawDte();
    });
  }
  drawDte();

  m.querySelector('#dte-add').onclick = () => { draft.push({ t: '', v: '', subs: [] }); drawDte(); };
  m.querySelector('#dte-prev').onclick = () => {
    preview = !preview;
    const pb = m.querySelector('#dte-prev');
    pb.setAttribute('aria-pressed', preview);
    pb.textContent = preview ? '계속 쓰기' : '미리보기';
    m.querySelector('#dte-add').classList.toggle('hidden', preview);
    m.querySelector('#dte-help').classList.toggle('hidden', preview);
    drawDte();
  };
  m.querySelector('#dte-cancel').onclick = closeModal;
  m.querySelector('#dte-save').onclick = async () => {
    const btn = m.querySelector('#dte-save');
    btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      const details = draft
        .filter(d => d.t.trim() || d.v.trim() || d.subs.some(sb => sb.t.trim() || sb.v.trim()))
        .map(d => ({
          t: d.t.trim(), v: d.v.replace(/\s+$/, ''),
          subs: d.subs.filter(sb => sb.t.trim() || sb.v.trim())
            .map(sb => ({ t: sb.t.trim(), v: sb.v.replace(/\s+$/, '') })),
        }));
      const now = Date.now();
      await F.updateDoc(ref('characters', c.id), { details, updatedAt: now });
      c.details = details; c.updatedAt = now;
      const i = state.chars.findIndex(x => x.id === c.id);
      if (i >= 0) state.chars[i] = { ...state.chars[i], details, updatedAt: now };
      closeModal();
      toast(`세부 묘사를 저장했어요 · ${details.length}편`);
      renderCharacter();
    } catch (e) {
      btn.disabled = false; btn.textContent = '저장';
      toast('저장하지 못했어요: ' + (e.code || e.message), 1);
    }
  };
}

/* ════════ 메모란 편집 ════════ */
function openMemoEditor(c) {
  const draft = (c.memos || []).map(mo => ({ label: mo.label || '', words: [...(mo.words || [])] }));
  let labels = [...((profile.memoLabels || []).length ? profile.memoLabels : MEMO_LABELS)];
  if (!draft.length) draft.push({ label: labels[0] || '메모', words: [] });

  const m = openModal({
    title: '메모 수정',
    wide: true,
    body: `<p class="hint" style="margin:0 0 14px">라벨을 고르고 키워드만 짧게 담아두는 칸이에요.
        키워드는 엔터나 쉼표로 하나씩 담깁니다.</p>
      <div id="mem-wrap"></div>
      <button class="btn btn-sm btn-ghost" id="mem-add" style="margin-top:4px">＋ 메모 줄 추가</button>
      <div class="adv" style="margin-top:20px">
        <div class="adv-head"><span class="eyebrow">라벨 관리</span></div>
        <div class="memo-words" id="mem-labels" style="margin-bottom:10px"></div>
        <div class="memo-add" style="margin-top:0">
          <input class="input" id="mem-newlabel" placeholder="새 라벨 (예: 진영 · 무기 · 테마)" maxlength="16">
          <button class="btn btn-sm" id="mem-addlabel">라벨 추가</button>
        </div>
        <p class="hint">라벨은 모든 캐릭터가 함께 써요. 라벨을 지워도 이미 적어둔 메모는 남습니다.</p>
      </div>`,
    foot: `<button class="btn btn-ghost" id="mem-cancel">취소</button>
           <button class="btn btn-key" id="mem-save">저장</button>`,
  });

  const wrap = m.querySelector('#mem-wrap');
  const pair = v => v.split('.').map(Number);

  const addWords = (i, text) => {
    const got = String(text).split(/[,\uFF0C\n]+/).map(w => w.trim()).filter(Boolean);
    if (!got.length) return false;
    const row = draft[i];
    got.forEach(w => { if (!row.words.includes(w) && row.words.length < 40) row.words.push(w); });
    return true;
  };

  function drawMem() {
    wrap.innerHTML = draft.map((mo, i) => {
      const opts = [...new Set([...labels, mo.label].filter(Boolean))];
      return `<div class="memo-edit-row">
        <div class="memo-edit-top">
          <select class="select" data-mlab="${i}">
            ${opts.map(l => `<option value="${esc(l)}" ${l === mo.label ? 'selected' : ''}>${esc(l)}</option>`).join('')}
          </select>
          <span class="ord">
            <button data-mup="${i}" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button data-mdn="${i}" title="아래로" ${i === draft.length - 1 ? 'disabled' : ''}>▼</button>
          </span>
          <button class="icon-btn" data-mrm="${i}" title="이 줄 지우기">✕</button>
        </div>
        <div class="memo-words">${mo.words.map((w, j) =>
          `<span class="memo-chip">${esc(w)}<button data-wrm="${i}.${j}" title="이 키워드 빼기">✕</button></span>`).join('')
          || `<span class="hint" style="margin:0">아직 키워드가 없어요.</span>`}</div>
        <div class="memo-add">
          <input class="input" data-wi="${i}" placeholder="키워드 입력 후 엔터" maxlength="24">
          <button class="btn btn-sm" data-wadd="${i}">담기</button>
        </div>
      </div>`;
    }).join('');

    wrap.querySelectorAll('[data-mlab]').forEach(el => el.onchange = () => {
      draft[+el.dataset.mlab].label = el.value;
    });
    wrap.querySelectorAll('[data-mrm]').forEach(el => el.onclick = () => {
      draft.splice(+el.dataset.mrm, 1);
      if (!draft.length) draft.push({ label: labels[0] || '메모', words: [] });
      drawMem();
    });
    wrap.querySelectorAll('[data-mup]').forEach(el => el.onclick = () => { move(draft, +el.dataset.mup, -1); drawMem(); });
    wrap.querySelectorAll('[data-mdn]').forEach(el => el.onclick = () => { move(draft, +el.dataset.mdn, 1); drawMem(); });
    wrap.querySelectorAll('[data-wrm]').forEach(el => el.onclick = () => {
      const [i, j] = pair(el.dataset.wrm); draft[i].words.splice(j, 1); drawMem();
    });
    wrap.querySelectorAll('[data-wadd]').forEach(el => el.onclick = () => {
      const i = +el.dataset.wadd;
      const inp = wrap.querySelector(`[data-wi="${i}"]`);
      if (addWords(i, inp.value)) { drawMem(); wrap.querySelector(`[data-wi="${i}"]`).focus(); }
    });
    wrap.querySelectorAll('[data-wi]').forEach(el => el.onkeydown = ev => {
      if (ev.key !== 'Enter') return;
      ev.preventDefault();
      const i = +el.dataset.wi;
      if (addWords(i, el.value)) { drawMem(); wrap.querySelector(`[data-wi="${i}"]`).focus(); }
    });
  }

  function drawLabels() {
    const box = m.querySelector('#mem-labels');
    box.innerHTML = labels.map((l, i) =>
      `<span class="memo-chip">${esc(l)}<button data-lrm="${i}" title="이 라벨 빼기">✕</button></span>`).join('')
      || `<span class="hint" style="margin:0">라벨이 없어요. 아래에서 하나 추가해 주세요.</span>`;
    box.querySelectorAll('[data-lrm]').forEach(el => el.onclick = () => {
      labels.splice(+el.dataset.lrm, 1); drawLabels(); drawMem();
    });
  }

  drawMem(); drawLabels();

  m.querySelector('#mem-add').onclick = () => {
    draft.push({ label: labels[0] || '메모', words: [] }); drawMem();
  };
  const newLab = m.querySelector('#mem-newlabel');
  const addLabel = () => {
    const v = newLab.value.trim();
    if (!v) return;
    if (labels.includes(v)) return toast('이미 있는 라벨이에요');
    if (labels.length >= 20) return toast('라벨은 20개까지 담을 수 있어요', 1);
    labels.push(v); newLab.value = '';
    drawLabels(); drawMem();
  };
  m.querySelector('#mem-addlabel').onclick = addLabel;
  newLab.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); addLabel(); } };

  m.querySelector('#mem-cancel').onclick = closeModal;
  m.querySelector('#mem-save').onclick = async () => {
    const btn = m.querySelector('#mem-save');
    btn.disabled = true; btn.textContent = '저장하는 중…';
    try {
      const memos = draft
        .map(mo => ({ label: (mo.label || '').trim(), words: mo.words.map(w => w.trim()).filter(Boolean) }))
        .filter(mo => mo.label && mo.words.length);
      const now = Date.now();
      await F.updateDoc(ref('characters', c.id), { memos, updatedAt: now });
      c.memos = memos; c.updatedAt = now;
      const i = state.chars.findIndex(x => x.id === c.id);
      if (i >= 0) state.chars[i] = { ...state.chars[i], memos, updatedAt: now };
      if (JSON.stringify(labels) !== JSON.stringify(profile.memoLabels || [])) {
        await F.setDoc(F.doc(db, 'users', uid), { memoLabels: labels }, { merge: true });
        profile.memoLabels = labels;
      }
      closeModal();
      toast(`메모를 저장했어요 · ${memos.length}줄`);
      renderCharacter();
    } catch (e) {
      btn.disabled = false; btn.textContent = '저장';
      toast('저장하지 못했어요: ' + (e.code || e.message), 1);
    }
  };
}

/* ════════ 발췌 · 폴더 ════════ */
const folders = () => state.current?.folders || [];
const folderName = id => folders().find(f => f.id === id)?.name || '';

function folderChipsHTML() {
  const counts = {};
  state.excerpts.forEach(e => { const k = e.folderId || ''; counts[k] = (counts[k] || 0) + 1; });
  const chips = [`<button class="chip" data-folder="__all" aria-pressed="${state.exFolder === null}">전체 ${state.excerpts.length}</button>`];
  folders().forEach(f => chips.push(
    `<button class="chip" data-folder="${f.id}" aria-pressed="${state.exFolder === f.id}">${esc(f.name)} ${counts[f.id] || 0}</button>`));
  if (counts['']) chips.push(
    `<button class="chip" data-folder="" aria-pressed="${state.exFolder === ''}">미분류 ${counts['']}</button>`);
  return chips.join('');
}

function visibleExcerpts() {
  let l = [...state.excerpts];
  if (state.exFolder !== null) l = l.filter(e => (e.folderId || '') === state.exFolder);
  if (state.exTags.length) l = l.filter(e => state.exTags.every(t => (e.tags || []).includes(t)));
  const q = state.exQ.trim().toLowerCase();
  if (q) l = l.filter(e => [e.title, e.body, e.memo, e.d1, e.d2, e.source]
    .some(t => (t || '').toLowerCase().includes(q)));
  const by = {
    recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
    old: (a, b) => (a.createdAt || 0) - (b.createdAt || 0),
    title: (a, b) => (a.title || '').localeCompare(b.title || '', 'ko', { numeric: true }),
  };
  return l.sort(by[state.exSort] || by.recent);
}

function excerptListHTML() {
  if (!state.excerpts.length)
    return `<p class="hint" style="margin:0">아직 발췌가 없어요. 이 캐릭터가 나오는 장면을 옮겨두면 여기에 쌓여요.</p>`;
  const l = visibleExcerpts();
  if (!l.length) return `<p class="hint" style="margin:0">조건에 맞는 발췌가 없어요.</p>`;
  return l.map(e => {
    const meta = [folderName(e.folderId), e.d1 || e.source, e.d2].filter(Boolean).map(esc).join(' · ');
    const tags = (e.tags || []).map(t => `<span class="tag">#${esc(t)}</span>`).join('');
    return `<button class="excerpt-item" data-ex="${e.id}">
      <h3>${esc(e.title || '제목 없음')}</h3>
      <p>${esc((e.body || '').slice(0, 140))}</p>
      ${tags ? `<div class="tags" style="margin-top:9px">${tags}</div>` : ''}
      ${meta ? `<div class="meta">${meta}</div>` : ''}
    </button>`;
  }).join('');
}

function bindExcerpts() {
  $$('[data-ex]').forEach(b => b.onclick = () => openSheet(b.dataset.ex));
}
function bindExcerptTools() {
  const q = $('#ex-q');
  if (q) q.oninput = e => { state.exQ = e.target.value; redrawExcerpts(false); };
  const sort = $('#ex-sort');
  if (sort) sort.onchange = e => { state.exSort = e.target.value; redrawExcerpts(false); };
  const adv = $('#ex-adv');
  if (adv) adv.onclick = () => { state.exAdv = !state.exAdv; renderCharacter(); };
  $$('#ex-adv-wrap [data-tag]').forEach(b => b.onclick = () => {
    const t = b.dataset.tag;
    state.exTags = state.exTags.includes(t) ? state.exTags.filter(x => x !== t) : [...state.exTags, t];
    renderCharacter();
  });
  const clr = $('#adv-clear');
  if (clr) clr.onclick = () => { state.exTags = []; renderCharacter(); };
  const mg = $('#adv-manage');
  if (mg) mg.onclick = () => openTagLevels('ex', tagCounts(state.excerpts), renderCharacter);
  $$('[data-folder]').forEach(b => b.onclick = () => {
    const v = b.dataset.folder;
    state.exFolder = v === '__all' ? null : v;
    redrawExcerpts();
  });
  bindExcerpts();
}
function redrawExcerpts(chips = true) {
  const list = $('#excerpt-list');
  if (list) list.innerHTML = excerptListHTML();
  if (chips) {
    const c = $('#folder-chips');
    if (c) c.innerHTML = folderChipsHTML();
  }
  bindExcerptTools();
}
async function refreshExcerpts() {
  const c = state.current;
  const hadTrash = state.exTrash.length;
  await loadExcerpts(c.id);
  const n = state.excerpts.length;
  c.excerptCount = n;
  await F.updateDoc(ref('characters', c.id), { excerptCount: n }).catch(() => {});
  if (!!hadTrash !== !!state.exTrash.length) renderCharacter();   // 휴지통 버튼 표시 갱신
  else redrawExcerpts();
}
async function saveFolders(list) {
  state.current.folders = list;
  await F.updateDoc(ref('characters', state.current.id), { folders: list, updatedAt: Date.now() });
}

/* 폴더 관리 */
function openFolders() {
  let draft = folders().map(f => ({ ...f }));
  const m = openModal({
    title: '발췌 폴더',
    body: `<p class="hint" style="margin:0 0 16px">장면을 묶어둘 폴더예요. 폴더를 지워도 발췌는 남고 미분류로 옮겨져요.</p>
      <div id="fd-wrap"></div>
      <button class="btn btn-sm btn-ghost" id="add-folder">＋ 폴더 추가</button>`,
    foot: `<button class="btn btn-ghost" id="fd-cancel">취소</button>
           <button class="btn btn-key" id="fd-save">저장</button>`,
  });
  function draw() {
    m.querySelector('#fd-wrap').innerHTML = draft.map((f, i) => `
      <div class="stat-edit-row">
        <input class="input" data-fn="${i}" value="${esc(f.name)}" placeholder="폴더 이름" maxlength="20">
        <button class="icon-btn" data-frm="${i}" title="폴더 지우기">✕</button>
      </div>`).join('') || `<p class="hint" style="margin:0 0 10px">아직 폴더가 없어요.</p>`;
    m.querySelectorAll('[data-fn]').forEach(el => el.oninput = e => draft[+el.dataset.fn].name = e.target.value);
    m.querySelectorAll('[data-frm]').forEach(el => el.onclick = () => { draft.splice(+el.dataset.frm, 1); draw(); });
  }
  draw();
  m.querySelector('#add-folder').onclick = () => { draft.push({ id: uidgen(), name: '' }); draw(); };
  m.querySelector('#fd-cancel').onclick = closeModal;
  m.querySelector('#fd-save').onclick = async () => {
    const list = draft.filter(f => f.name.trim()).map(f => ({ id: f.id, name: f.name.trim() }));
    const gone = folders().filter(f => !list.some(x => x.id === f.id)).map(f => f.id);
    try {
      await saveFolders(list);
      for (const e of state.excerpts.filter(e => gone.includes(e.folderId))) {
        e.folderId = '';
        await F.updateDoc(ref('characters', state.current.id, 'excerpts', e.id), { folderId: '' });
      }
      if (state.exFolder && gone.includes(state.exFolder)) state.exFolder = null;
      closeModal(); redrawExcerpts(); toast('폴더를 저장했어요');
    } catch (err) { toast('저장하지 못했어요: ' + (err.code || err.message), 1); }
  };
}

/* ── 형광펜 ── */
function bodyHTML(e) {
  const text = e.body || '';
  const hs = (e.highlights || []).slice().sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  for (const h of hs) {
    const s = Math.max(pos, Math.min(text.length, h.s));
    const en = Math.max(s, Math.min(text.length, h.e));
    if (en <= s) continue;
    out += esc(text.slice(pos, s));
    out += `<mark style="background:${HL[h.c] || HL.y}">${esc(text.slice(s, en))}</mark>`;
    pos = en;
  }
  return out + esc(text.slice(pos));
}

function selOffsets(container) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0);
  if (!container.contains(r.commonAncestorContainer)) return null;
  const pre = r.cloneRange();
  pre.selectNodeContents(container);
  pre.setEnd(r.startContainer, r.startOffset);
  const s = pre.toString().length;
  const len = r.toString().length;
  return len ? { s, e: s + len } : null;
}

async function applyHighlight(e, color, bodyEl) {
  const sel = selOffsets(bodyEl);
  if (!sel) return toast(color ? '칠할 부분을 먼저 드래그해 주세요' : '지울 부분을 먼저 드래그해 주세요');
  const kept = [];
  for (const h of (e.highlights || [])) {
    if (h.e <= sel.s || h.s >= sel.e) { kept.push(h); continue; }
    if (h.s < sel.s) kept.push({ s: h.s, e: sel.s, c: h.c });
    if (h.e > sel.e) kept.push({ s: sel.e, e: h.e, c: h.c });
  }
  if (color) kept.push({ s: sel.s, e: sel.e, c: color });
  kept.sort((a, b) => a.s - b.s);
  e.highlights = kept;
  bodyEl.innerHTML = bodyHTML(e);
  window.getSelection()?.removeAllRanges();
  try {
    await F.updateDoc(ref('characters', state.current.id, 'excerpts', e.id), { highlights: kept });
  } catch (err) { toast('형광펜을 저장하지 못했어요', 1); }
}

function bindViewTools(wrap) {

  wrap.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
    readPrefs.size = Math.max(12, Math.min(30, +(readPrefs.size + Number(b.dataset.size) * 0.5).toFixed(1)));

  wrap.querySelectorAll('[data-lh]').forEach(b => b.onclick = () => {
    readPrefs.lh = Math.max(1.4, Math.min(3, +(readPrefs.lh + Number(b.dataset.lh) * 0.1).toFixed(1)));
    bodies().forEach(el => el.style.lineHeight = readPrefs.lh);
    wrap.querySelector('#t-lh').textContent = readPrefs.lh.toFixed(1);

    wrap.querySelectorAll('[data-font]').forEach(x => x.setAttribute('aria-pressed', x.dataset.font === readPrefs.font));
