/* ════════ 백업 ════════ */
function progressModal(title) {
  const m = openModal({
    title,
    body: `<p class="hint" id="pg-text" style="margin:0">준비하는 중…</p>
      <div style="height:4px;background:var(--hair);border-radius:2px;margin-top:14px;overflow:hidden">
        <div id="pg-bar" style="height:100%;width:0;background:var(--teal);transition:width .2s"></div></div>`,
  });
  return {
    set(text, ratio) {
      const t = m.querySelector('#pg-text'), b = m.querySelector('#pg-bar');
      if (t) t.textContent = text;
      if (b) b.style.width = Math.round((ratio || 0) * 100) + '%';
    },
    done: closeModal,
  };
}

async function exportBackup(withImages) {
  const pg = progressModal('내보내는 중');
  try {
    const data = {
      app: 'chararchive', v: 1, exportedAt: Date.now(),
      nickname: profile.nickname, formPreset: profile.formPreset || null,
      statSets: state.statSets.map(x => ({ ...x })),
      notices: state.notices.map(x => ({ ...x })),
      characters: [], images: {},
    };
    const total = state.chars.length || 1;
    for (let i = 0; i < state.chars.length; i++) {
      const c = state.chars[i];
      pg.set(`캐릭터 ${i + 1} / ${state.chars.length} · ${c.name || ''}`, (i + 1) / total * (withImages ? .6 : .95));
      const snap = await F.getDocs(col('characters', c.id, 'excerpts'));
      data.characters.push({ ...c, excerpts: snap.docs.map(d => ({ id: d.id, ...d.data() })) });
    }
    if (withImages) {
      const withImg = state.chars.filter(c => c.imageId);
      for (let i = 0; i < withImg.length; i++) {
        pg.set(`이미지 ${i + 1} / ${withImg.length}`, .6 + (i + 1) / (withImg.length || 1) * .35);
        const d = await loadFullImage(withImg[i].imageId);
        if (d) data.images[withImg[i].imageId] = d;
      }
    }
    pg.set('파일로 묶는 중…', .98);
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `archive-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 6000);
    pg.done();
    toast(`내보냈어요 · 캐릭터 ${data.characters.length} · ${(blob.size / 1048576).toFixed(1)}MB`);
  } catch (e) {
    pg.done();
    toast('내보내지 못했어요: ' + (e.code || e.message), 1);
  }
}

async function importBackup(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
    if (data.app !== 'chararchive' || !Array.isArray(data.characters)) throw 0;
  } catch { return toast('이 아카이브의 백업 파일이 아니에요', 1); }

  const exCount = data.characters.reduce((n, c) => n + (c.excerpts?.length || 0), 0);
  const imgCount = Object.keys(data.images || {}).length;
  const ok = await confirmDialog('백업을 불러올까요?',
    `캐릭터 ${data.characters.length} · 발췌 ${exCount} · 스탯 세트 ${data.statSets?.length || 0} · 공지 ${data.notices?.length || 0}` +
    `${imgCount ? ` · 이미지 ${imgCount}` : ''} 을 넣어요. 같은 항목은 백업 내용으로 덮어써요.`, '불러오기');
  if (!ok) return;

  const pg = progressModal('불러오는 중');
  try {
    const totalSteps = data.characters.length + exCount + imgCount +
      (data.statSets?.length || 0) + (data.notices?.length || 0) + 1;
    let step = 0;
    const tick = t => { step++; pg.set(t, step / totalSteps); };

    for (const st of (data.statSets || [])) {
      const { id, ...rest } = st;
      await F.setDoc(ref('statSets', id || uidgen()), rest);
      tick('스탯 세트');
    }
    for (const n of (data.notices || [])) {
      const { id, ...rest } = n;
      await F.setDoc(ref('notices', id || uidgen()), rest);
      tick('공지');
    }
    for (const [imgId, dataUrl] of Object.entries(data.images || {})) {
      await F.setDoc(ref('images', imgId), { data: dataUrl, updatedAt: Date.now() });
      tick('이미지');
    }
    for (const c of data.characters) {
      const { id, excerpts = [], ...rest } = c;
      const cid = id || uidgen();
      await F.setDoc(ref('characters', cid), rest);
      tick(`캐릭터 · ${rest.name || ''}`);
      for (const e of excerpts) {
        const { id: eid, ...erest } = e;
        await F.setDoc(ref('characters', cid, 'excerpts', eid || uidgen()), erest);
        tick('발췌');
      }
    }
    if (data.formPreset) {
      await F.setDoc(F.doc(db, 'users', uid), { formPreset: data.formPreset }, { merge: true });
      profile.formPreset = data.formPreset;
    }
    tick('마무리');

    await Promise.all([loadChars(), loadStatSets(), loadNotices()]);
    pg.done();
    renderGallery();
    toast(`불러왔어요 · 캐릭터 ${data.characters.length}명`);
  } catch (e) {
    pg.done();
    toast('불러오지 못했어요: ' + (e.code || e.message), 1);
  }
}

    toast('Firebase에 연결하지 못했어요. 설정을 확인해 주세요', 1);

})();
